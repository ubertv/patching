<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Patching">
  <!-- Favicon, drawn rather than downscaled: the full artwork turns to mush
       below about 64px. Four jacks and two crossing cables is the most that
       survives 16px, and it's enough to read as patching. Straight cables,
       not curves — at this size curves overlap into a blob.
       Colours are the app's own palette, so the mark and the diagram legend
       agree: audio red, pitch blue. -->
  <circle cx="32" cy="32" r="32" fill="#23272d"/>
  <g fill="none" stroke-linecap="round" stroke-width="5.5">
    <path d="M19 20 L45 44" stroke="#b5322c"/>
    <path d="M45 20 L19 44" stroke="#2f5fd0"/>
  </g>
  <g>
    <circle cx="19" cy="20" r="7.5" fill="#f7f5f1"/>
    <circle cx="45" cy="20" r="7.5" fill="#f7f5f1"/>
    <circle cx="19" cy="44" r="7.5" fill="#f7f5f1"/>
    <circle cx="45" cy="44" r="7.5" fill="#f7f5f1"/>
    <circle cx="19" cy="20" r="3.4" fill="#b5322c"/>
    <circle cx="45" cy="20" r="3.4" fill="#2f5fd0"/>
    <circle cx="19" cy="44" r="3.4" fill="#2f5fd0"/>
    <circle cx="45" cy="44" r="3.4" fill="#b5322c"/>
  </g>
</svg>
