/* ---------------------------------------------------------------- layout --- */
/*
   Pane sizes and zoom are workspace state, not patch data. They belong to this
   browser rather than to the diagram, so they get their own key and never touch
   the patch file.
*/
var LS_UI = "patching-ui-v1";
var ui = { sidebar:400, msgs:180, zoom:1, focus:"", view:"diagram", selDim:true };
try { var u = JSON.parse(lsGet(LS_UI)); if (u) for (var k in u) ui[k] = u[k]; } catch(e){}
function saveUI(){ try { localStorage.setItem(LS_UI, JSON.stringify(ui)); } catch(e){} }
/* Full-width focus for either pane. One at a time, Escape restores, and the
   choice persists — if you mostly read diagrams you shouldn't have to reclaim
   the space every session. */
var ICON_EXPAND = '<svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true">'+
  '<path d="M6.5 2.5H2.5v4M9.5 2.5h4v4M6.5 13.5H2.5v-4M9.5 13.5h4v-4" fill="none" '+
  'stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
var ICON_COLLAPSE = '<svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true">'+
  '<path d="M2.5 6.5h4v-4M13.5 6.5h-4v-4M2.5 9.5h4v4M13.5 9.5h-4v4" fill="none" '+
  'stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';

function applyFocus(){
  var left = document.getElementById("left"),
      right = document.getElementById("right"),
      hs = document.getElementById("hsplit"),
      be = document.getElementById("focused"),
      bc = document.getElementById("focusc");
  left.style.display  = ui.focus === "canvas" ? "none" : "flex";
  right.style.display = ui.focus === "editor" ? "none" : "flex";
  hs.style.display    = ui.focus ? "none" : "block";
  left.style.width    = ui.focus === "editor" ? "100%" : ui.sidebar + "px";
  be.innerHTML = ui.focus === "editor" ? ICON_COLLAPSE : ICON_EXPAND;
  bc.innerHTML = ui.focus === "canvas" ? ICON_COLLAPSE : ICON_EXPAND;
  be.title = ui.focus === "editor" ? "Restore split view" : "Expand the editor (Esc to restore)";
  bc.title = ui.focus === "canvas" ? "Restore split view"
    : "Expand the " + (ui.view === "guide" ? "guide" : "diagram") + " (Esc to restore)";
}
/* The guide is rebuilt on switch and on every render, not cached. It's a pure
   function over the parse, and a patch big enough for that to cost anything
   would be too big to follow anyway. */
function renderGuide(){
  if (ui.view !== "guide") return;
  document.getElementById("guidewrap").innerHTML = guideHTML();
}
function setView(which){
  ui.view = which === "guide" ? "guide" : "diagram";
  var g = ui.view === "guide";
  document.getElementById("guidewrap").style.display  = g ? "block" : "none";
  document.getElementById("canvaswrap").style.display = g ? "none" : "flex";
  document.getElementById("zoomctl").style.display    = g ? "none" : "flex";
  document.getElementById("guidectl").style.display   = g ? "flex" : "none";
  document.getElementById("vguide").classList.toggle("on", g);
  document.getElementById("vdiagram").classList.toggle("on", !g);
  document.getElementById("focusc").title =
    (ui.focus === "canvas" ? "Restore split view" : "Expand the " + (g ? "guide" : "diagram")) +
    (ui.focus === "canvas" ? "" : " (Esc to restore)");
  if (g) renderGuide(); else setTimeout(fitWidth, 0);
  saveUI();
}
document.getElementById("bdim").addEventListener("click", function(){
  ui.selDim = !ui.selDim; saveUI(); render();
});
document.getElementById("bshowall").addEventListener("click", function(){
  clearSel(); render();
});
document.getElementById("vdiagram").addEventListener("click", function(){ setView("diagram"); });
document.getElementById("vguide").addEventListener("click", function(){ setView("guide"); });
document.getElementById("gprint").addEventListener("click", function(){ window.print(); });
document.getElementById("gcopy").addEventListener("click", function(){
  var b = this;
  navigator.clipboard.writeText(guideMarkdown()).then(function(){
    b.textContent = "Copied"; setTimeout(function(){ b.textContent = "Copy"; }, 1200);
  }).catch(function(){ b.textContent = "Copy failed"; setTimeout(function(){ b.textContent = "Copy"; }, 1600); });
});

function setFocus(which){
  ui.focus = ui.focus === which ? "" : which;
  applyFocus(); saveUI();
  if (ui.focus !== "editor") setTimeout(fitWidth, 0);
}
document.getElementById("focused").addEventListener("click", function(){ setFocus("editor"); });
document.getElementById("focusc").addEventListener("click", function(){ setFocus("canvas"); });
document.addEventListener("keydown", function(ev){
  if (ev.key !== "Escape" || ev.__escHandled || !selCount()) return;
  clearSel(); render(); ev.__escHandled = true;
});

document.addEventListener("keydown", function(ev){
  if (ev.key !== "Escape" || ev.__escHandled || !ui.focus) return;
  ui.focus = ""; applyFocus(); saveUI(); setTimeout(fitWidth, 0);
});

/* The one keyboard shortcut, for the one button reached for after every burst
   of typing. Modifier plus Enter so it works from inside the editor, where the
   cursor lives. Deliberately not a shortcut system: everything else here is
   used too rarely to be worth colliding with the browser's own bindings. */
document.addEventListener("keydown", function(ev){
  if ((ev.metaKey || ev.ctrlKey) && ev.key === "Enter"){
    ev.preventDefault();
    document.getElementById("btidy").click();
  }
});

function applyLayout(){
  document.getElementById("msgs").style.height = ui.msgs + "px";
  applyFocus();
}

/* One drag handle, two axes. Both clamp, so you can't drag a pane out of
   existence and then wonder where the editor went. */
function splitter(id, horizontal){
  var el = document.getElementById(id), start = null;
  el.addEventListener("mousedown", function(ev){
    ev.preventDefault();
    start = { x:ev.clientX, y:ev.clientY, sidebar:ui.sidebar, msgs:ui.msgs };
    el.classList.add("dragging");
    document.body.style.cursor = horizontal ? "col-resize" : "row-resize";
    document.addEventListener("mousemove", move);
    document.addEventListener("mouseup", up);
  });
  function move(ev){
    if (!start) return;
    if (horizontal)
      ui.sidebar = Math.max(240, Math.min(window.innerWidth - 320,
        start.sidebar + (ev.clientX - start.x)));
    else
      ui.msgs = Math.max(0, Math.min(window.innerHeight - 220,
        start.msgs - (ev.clientY - start.y)));
    applyLayout();
  }
  function up(){
    document.removeEventListener("mousemove", move);
    document.removeEventListener("mouseup", up);
    el.classList.remove("dragging"); document.body.style.cursor = "";
    start = null; saveUI();
  }
}
splitter("hsplit", true);
splitter("vsplit", false);

/* Zoom scales the rendered box and leaves the viewBox alone, so text and strokes
   stay vector-crisp rather than being scaled as a bitmap. */
function applyZoom(){
  var svg = document.getElementById("diagram");
  if (!svg || !view.w) return;
  svg.style.width  = Math.round(view.w * ui.zoom) + "px";
  svg.style.height = Math.round(view.h * ui.zoom) + "px";
  var lbl = document.getElementById("zoomlvl");
  if (lbl) lbl.textContent = Math.round(ui.zoom * 100) + "%";
}
function setZoom(z){ ui.zoom = Math.max(0.2, Math.min(3, z)); applyZoom(); saveUI(); }
/* Never magnify. Fitting is for getting a diagram that is too big onto the
   screen; blowing a four-module patch up to 131% because there is room is not
   what anyone means by fit, and the zoom then sticks around for the next patch
   you type. */
function fitWidth(){
  var pane = document.getElementById("right");
  if (view.w) setZoom(Math.min(1, (pane.clientWidth - 46) / view.w));
}

/* Fit width is the wrong tool when the diagram is taller than it is wide, which
   is what a patch with many parallel voices looks like: it barely scales and
   you still scroll three screens. */
function fitPage(){
  var pane = document.getElementById("right");
  if (!view.w || !view.h) return;
  setZoom(Math.min(1, (pane.clientWidth - 46) / view.w,
                      (pane.clientHeight - 60) / view.h));
}
document.getElementById("zin").addEventListener("click", function(){ setZoom(ui.zoom * 1.25); });
document.getElementById("zout").addEventListener("click", function(){ setZoom(ui.zoom / 1.25); });
document.getElementById("z100").addEventListener("click", function(){ setZoom(1); });
document.getElementById("zfit").addEventListener("click", fitWidth);
document.getElementById("zfitpage").addEventListener("click", fitPage);

/* ---------------------------------------------------------------------- boot --- */

if (!M.length){
  document.body.innerHTML = '<div style="padding:30px;color:#e0605e">Couldn\'t load '+
    '<span style="font-family:monospace">../data/modules.js</span>. This file has to live in '+
    '<span style="font-family:monospace">tools/</span>.</div>';
} else if (CLASH.length){
  document.body.innerHTML = '<div style="padding:30px;color:#e0605e;max-width:640px;line-height:1.6">'+
    '<b>Refusing to start.</b> These ids exist in both <span style="font-family:monospace">data/modules.js</span> '+
    'and <span style="font-family:monospace">tools/generic-modules.js</span>: '+
    '<span style="font-family:monospace">'+esc(CLASH.join(", "))+'</span>.<br><br>'+
    'A generic placeholder shadowing a module you actually own would put wrong jacks in every patch '+
    'that used it, silently. Rename the generic and reload.</div>';
} else {
  applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light");
  var withJacks = M.filter(function(m){ return jacksFor(m.id) && !noJacks(m.id); }).length;
  document.getElementById("src").value = patch.src || "";
  document.getElementById("pname").value = patch.name || "";
  document.getElementById("notes").value = patch.notes || "";
  applyLayout();
  setView(ui.view);   /* after applyLayout, so the pane it shows is the one that stays */
  paintExamples();
  paintList();
  render();
  save();   /* so a freshly created patch survives a reload even if you never type */
  /* On a phone the diagram opens scrolled off its own right edge unless it's
     fitted, because the SVG carries an explicit width. Fit on arrival, and
     again when the phone rotates — which arrives as a resize. Desktop resizes
     are left alone: zoom there is a choice the user made. */
  if (window.innerWidth <= 760) setTimeout(fitWidth, 0);
  var refit = null;
  window.addEventListener("resize", function(){
    clearTimeout(refit);
    refit = setTimeout(function(){ if (window.innerWidth <= 760) fitWidth(); }, 150);
  });
  if (!withJacks) msg("err", "No jack data found in modules.js or jack-seed.js. Run the annotator first.");
}

})();
