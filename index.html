<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Patching</title>
<link rel="icon" href="img/icon.svg" type="image/svg+xml">
<link rel="icon" href="img/icon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="theme-color" content="#23272d">
<script>
/* Before first paint, or the page flashes light then snaps dark. Duplicated in
   all three pages because each one has to stand alone off a filesystem. */
(function(){
  var t = null;
  try { t = localStorage.getItem("patching-theme-v1"); } catch(e){}
  if (t !== "dark" && t !== "light")
    t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", t);
})();
</script>
<meta name="description" content="Signal flow diagrams for modular synthesizers. Write the patch as text and it draws the diagram.">
<meta property="og:title" content="Patching">
<meta property="og:description" content="Signal flow diagrams for modular synthesizers. Write the patch as text and it draws the diagram.">
<!-- Absolute, because social scrapers do not resolve relative URLs. Change the
     host if you move it. -->
<meta property="og:image" content="https://isgav.in/patching/img/social.png">
<meta property="og:url" content="https://isgav.in/patching/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{
  /* Paper first. The diagram is the product and it gets printed, so the whole
     interface is paper stock and the canvas stops being a white hole punched in
     a dark app. --mat is the desk the page sits on. */
  --paper:#f7f5f1; --surface:#fffefb; --surface2:#efece5; --mat:#e4e0d7;
  --line:#dcd7cd; --line2:#c8c2b6;
  --ink:#1f1d1a; --ink2:#5b5750; --ink3:#8f8a80;
  --accent:#2f5fd0; --accent-soft:#e8eefb;
  --ok:#1a6f4d; --warn:#8a6208; --bad:#a3312b;
  /* Message strips. Named so the dark theme can restate them in one place. */
  --err-bg:#fdeceb; --err-ink:#7d2521;
  --warn-bg:#fdf6e6; --warn-ink:#6b4d07;
  --ok-bg:#eaf5ef;  --ok-ink:#155c40;
  --shadow:rgba(31,29,26,.16); --shadow-soft:rgba(31,29,26,.07);
  /* The diagram sheet. Its own variable because the diagram is an object on
     the desk, not part of the interface surface. */
  --sheet:#ffffff;

  /* No webfont: self-hosting means shipping binaries and a CDN link would add a
     network dependency to something that otherwise has none. This picks the best
     available locally and degrades quietly. */
  --sans:"SF Pro Text",-apple-system,"Inter","IBM Plex Sans","Segoe UI",Roboto,
         "Helvetica Neue",Arial,sans-serif;
  --mono:"SF Mono","JetBrains Mono","IBM Plex Mono","Cascadia Code",
         ui-monospace,SFMono-Regular,Menlo,monospace;
}

/* Dark. Same paper metaphor turned over: the mat is the darkest thing, the
   diagram sheet the lightest, so the page still reads as an object on a desk.
   Set on <html> before first paint, so there is no flash of the wrong theme. */
:root[data-theme="dark"]{
  --paper:#17181a; --surface:#1e2023; --surface2:#282b2f; --mat:#0f1012;
  --line:#33373c; --line2:#454a51;
  --ink:#e8e6e1; --ink2:#a9a49c; --ink3:#7b766e;
  --accent:#6c9bff; --accent-soft:#1c2740;
  --ok:#4fbf8f; --warn:#d8a63c; --bad:#e2726b;
  --err-bg:#2c1c1b;  --err-ink:#f0a49d;
  --warn-bg:#2b2415; --warn-ink:#e3c079;
  --ok-bg:#16271f;   --ok-ink:#7fd3ac;
  --shadow:rgba(0,0,0,.55); --shadow-soft:rgba(0,0,0,.35);
  --sheet:#1a1c1f;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--ink); overflow:hidden;
  font:13.5px/1.55 var(--sans);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  display:flex; flex-direction:column;
}
button,input,textarea,select{font:inherit; color:inherit}
button{
  background:var(--surface); border:1px solid var(--line2); color:var(--ink);
  border-radius:5px; padding:4px 10px; cursor:pointer;
  box-shadow:0 1px 0 var(--shadow-soft);
}
button:hover{background:var(--surface2); border-color:var(--line2)}
button:active{background:var(--surface2); filter:brightness(.94)}
button.primary{background:var(--accent); border-color:var(--accent); color:#fff}
button.primary:hover{filter:brightness(1.12)}
button:disabled{opacity:.4; cursor:not-allowed}
input[type=text],textarea,select{
  background:var(--surface); border:1px solid var(--line2); border-radius:5px;
  padding:4px 8px; outline:none;
}
input:focus,textarea:focus,select:focus{
  border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);
}
a{color:var(--accent)}
.mono{font-family:var(--mono)}
kbd{
  background:var(--surface2); border:1px solid var(--line2); border-bottom-width:2px;
  border-radius:4px; padding:0 4px; font:11px/1.6 var(--mono); color:var(--ink2);
}

#top{
  display:flex; align-items:center; gap:9px; padding:9px 14px; flex:none;
  background:var(--surface); border-bottom:1px solid var(--line);
}
#brandmark{display:block; flex:none; border-radius:50%}
#top h1{font-size:14px; margin:0; font-weight:650; letter-spacing:-.01em}
#top h1 span{color:var(--ink3); font-weight:400; letter-spacing:0}
#top .spacer{flex:1}
#pname{width:230px}
/* Navigation reads as tabs, not as links with arrows. An arrow tells you
   nothing about where you're going or where you already are. */
#nav{display:flex; gap:2px; background:var(--surface2); padding:2px;
     border-radius:7px; border:1px solid var(--line)}
#nav a{
  color:var(--ink2); text-decoration:none; padding:3px 12px; border-radius:5px;
  font-size:12.5px; font-weight:500;
}
#nav a:hover{color:var(--ink); background:var(--surface)}
#nav a.active{background:var(--surface); color:var(--ink); font-weight:600;
  box-shadow:0 1px 2px var(--shadow-soft)}
.vrule{width:1px; height:20px; background:var(--line); flex:none; margin:0 3px}

/* Dropdowns. Everything is a labelled word — no bare glyphs, because a "?" is
   only obvious to someone who already knows what's behind it. */
.menu{position:relative}
.menu > button::after{content:"▾"; margin-left:5px; font-size:9px; opacity:.55;
  position:relative; top:-1px}
.menu.open > button{background:var(--surface2); border-color:var(--line2)}
.dropdown{
  position:absolute; top:calc(100% + 5px); right:0; min-width:210px; z-index:40;
  background:var(--surface); border:1px solid var(--line2); border-radius:7px;
  padding:4px; display:none; box-shadow:0 10px 30px var(--shadow);
}
.menu.open .dropdown{display:block}
/* Menus hang from the edge they sit nearest, so one on the left opens rightward
   and one on the right opens leftward. Either way it stays on screen and stays
   under the button that opened it. */
.menu.left .dropdown{left:0; right:auto}
.dropdown button,.dropdown a{
  display:block; width:100%; text-align:left; background:none; border:none;
  padding:6px 10px; border-radius:5px; font-size:12.5px; color:var(--ink);
  text-decoration:none; cursor:pointer; box-shadow:none;
}
.dropdown button:hover,.dropdown a:hover{background:var(--accent-soft); color:var(--accent)}
.dropdown button.danger:hover{background:var(--err-bg); color:var(--bad)}
/* A refused item shouldn't light up under the pointer as though it were live.
   The tooltip is the explanation; the lack of highlight is the signal. */
.dropdown button:disabled:hover{background:none; color:var(--ink)}
.dropdown hr{border:none; border-top:1px solid var(--line); margin:4px 6px}
.dropdown .lbl{padding:6px 10px 3px; font-size:10px; text-transform:uppercase;
  letter-spacing:.09em; color:var(--ink3); font-weight:650}
.dropdown small{display:block; color:var(--ink3); font-size:11px; margin-top:1px}
#stat{color:var(--ink2); font-size:12px}

/* Where this patch stands relative to patches/patches.js. Quiet, because it's
   reassurance rather than an alert, but present — without it "Revert to file"
   is a menu item for a state you can't see you're in. Empty for a patch that
   only exists in this browser, since there's nothing to say about it. */
#pstate{
  font-size:10.5px; letter-spacing:.05em; text-transform:uppercase; font-weight:650;
  padding:2px 7px; border-radius:20px; flex:none; cursor:default;
}
#pstate:empty{display:none}
#pstate.file{background:var(--surface2); color:var(--ink3); border:1px solid var(--line)}
#pstate.edited{background:var(--accent-soft); color:var(--accent); border:1px solid transparent}

#cols{display:flex; flex:1; min-height:0}
#left{
  width:400px; flex:none; display:flex; flex-direction:column; min-height:0;
  background:var(--surface);
}
#right{
  flex:1; min-width:0; position:relative; overflow:auto;
  background:var(--mat); display:flex; flex-direction:column;
}

/* Drag handles. Thin, invisible until you need them. */
#hsplit{
  width:5px; flex:none; cursor:col-resize; background:var(--line);
  transition:background .12s;
}
#hsplit:hover,#hsplit.dragging{background:var(--accent)}
#vsplit{
  height:5px; flex:none; cursor:row-resize; background:var(--line);
  transition:background .12s;
}
#vsplit:hover,#vsplit.dragging{background:var(--accent)}

h2{
  font-size:10.5px; text-transform:uppercase; letter-spacing:.1em; color:var(--ink3);
  margin:0; font-weight:650; padding:10px 14px 6px;
  display:flex; align-items:center; gap:8px;
}
h2 .spacer{flex:1}
/* Pane controls. Icons are fine here where a text label would crowd the header,
   but every one carries a tooltip and they use the conventional expand/collapse
   arrows rather than something invented. */
.panebtn{
  padding:2px 5px; line-height:0; color:var(--ink3); border-color:transparent;
  background:none; box-shadow:none;
}
.panebtn:hover{color:var(--ink); background:var(--surface2); border-color:var(--line)}
.panebtn svg{display:block}
#srcwrap{flex:1 1 auto; display:flex; flex-direction:column; min-height:60px; position:relative}
#src{
  flex:1; width:100%; border:none; border-radius:0; resize:none; padding:6px 14px 14px;
  font-family:var(--mono); font-size:12.5px; line-height:1.7;
  background:var(--surface); color:var(--ink);
}
#src:focus{box-shadow:none}
#src::placeholder{color:var(--ink3)}
#ac{
  position:absolute; z-index:20; background:var(--surface); border:1px solid var(--accent);
  border-radius:6px; max-height:210px; overflow:auto; display:none; min-width:240px;
  box-shadow:0 8px 24px var(--shadow);
}
#ac div{padding:3px 10px; cursor:pointer; font-family:var(--mono); font-size:12px}
#ac div.sel{background:var(--accent); color:#fff}
#ac div small{color:var(--ink3); margin-left:8px; font-family:var(--sans)}
#ac div.sel small{color:var(--accent-soft)}

#msgs{flex:0 0 auto; overflow:auto; background:var(--paper); min-height:0}
#notewrap{flex:0 0 auto; border-top:1px solid var(--line); padding:6px 10px 8px;
  background:var(--surface)}
#notewrap label{display:flex; align-items:baseline; gap:8px; font-size:10px;
  text-transform:uppercase; letter-spacing:.09em; color:var(--ink3); font-weight:600;
  margin-bottom:4px}
#notehint{text-transform:none; letter-spacing:0; font-weight:400; font-size:11px;
  color:var(--ink3)}
#notes{width:100%; resize:vertical; min-height:34px; font:12.5px/1.5 var(--sans)}
.msg{margin:7px 12px; padding:7px 10px; border-radius:5px; font-size:12px; line-height:1.5}
.msg.err{background:var(--err-bg); border:1px solid var(--line2); color:var(--err-ink)}
.msg.warn{background:var(--warn-bg); border:1px solid var(--line2); color:var(--warn-ink)}
.msg.ok{background:var(--ok-bg); border:1px solid var(--line2); color:var(--ok-ink)}
.msg b{color:inherit; font-weight:650}
.msg .ln{font-family:var(--mono); color:var(--ink3); margin-right:6px}
.msg.goto{cursor:pointer}
.msg.goto:hover{filter:brightness(.97)}
.msg.goto:hover .ln{color:var(--ink); text-decoration:underline}

#zoombar{
  flex:none; display:flex; align-items:center; gap:6px; padding:7px 12px;
  background:var(--mat); border-bottom:1px solid var(--line2);
  position:sticky; top:0; z-index:5;
}
#zoombar button{padding:2px 8px; font-size:12px}
#zoombar button.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent)}
#zoombar select{padding:2px 6px; font-size:12px}
#zoombar .vrule{margin:0 2px}
#zoomlvl{color:var(--ink2); font-size:12px; min-width:44px; text-align:center;
  font-variant-numeric:tabular-nums}
/* align-self, and the min-width that goes with it, are load-bearing. #right is
   a column flex container, so by default this stretches to the pane's width and
   stays there however wide the diagram gets: zoom in past the pane and the
   height keeps growing while the width appears to stop, because the box holding
   the sheet never grows and there is nothing for the pane to scroll to.
   flex-start lets it size to the diagram; min-width keeps it filling the pane
   when the diagram is smaller. */
#canvaswrap{padding:22px; flex:1; align-self:flex-start; min-width:100%}
#zoomctl,#guidectl{display:flex; gap:6px; align-items:center}
.seg{display:flex; gap:2px; background:var(--surface2); padding:2px; border-radius:6px;
  border:1px solid var(--line)}
.seg button{padding:2px 10px; font-size:12px; border-color:transparent; background:none;
  box-shadow:none; color:var(--ink2); border-radius:4px}
.seg button.on{background:var(--surface); color:var(--ink); font-weight:600;
  box-shadow:0 1px 2px var(--shadow-soft)}

/* The guide is a document, not an interface, so it gets document measure and
   document spacing rather than the app's density. */
#guidewrap{display:none; flex:1; overflow:auto; padding:26px 30px}
#guidedoc{max-width:62ch}
#guidedoc h1{font-size:19px; margin:0 0 3px; font-weight:650}
#guidedoc .gmeta{color:var(--ink3); font-size:12px; margin-bottom:14px}
#guidedoc .gnotes{color:var(--ink2); margin:0 0 18px; line-height:1.6;
  border-left:2px solid var(--line2); padding-left:12px}
#guidedoc .gempty{color:var(--ink3)}
#guidedoc h2{font-size:11px; text-transform:uppercase; letter-spacing:.1em;
  color:var(--ink3); font-weight:650; margin:26px 0 6px;
  border-bottom:1px solid var(--line); padding-bottom:5px}
#guidedoc h3{font-size:12px; font-weight:600; color:var(--ink2); margin:14px 0 2px}
#guidedoc table{width:100%; border-collapse:collapse}
#guidedoc td{padding:3px 8px 3px 0; vertical-align:baseline; border:none}
.gsteps .gn{color:var(--ink3); font-size:11.5px; text-align:right; width:2.4em;
  font-variant-numeric:tabular-nums; padding-right:10px}
.gsteps .gmod,.gset .gmod{white-space:nowrap}
.gsteps .gj{font-family:var(--mono); font-size:12px; font-weight:600; white-space:nowrap}
.gsteps .garr{color:var(--ink3); padding:0 4px}
.gsteps .grow-note td{color:var(--ink3); font-size:11.5px; padding-top:0; padding-bottom:6px}
.gset .gmod{color:var(--ink2)}
.gparam{display:inline-block; margin-right:14px; font-size:12.5px}
.gparam b{font-family:var(--mono); font-size:11.5px; font-weight:600; color:var(--ink2)}

/* Cmd+P gives the pane you're looking at and nothing else. Wanted for the
   diagram anyway; the guide is the thing you actually carry to the rack. */
/* One breakpoint, reading first. Below it the panes stack with the diagram on
   top, because someone arriving on a phone wants to look at a patch, not type
   one — the editor stays underneath, functional but secondary. Dragging boxes
   needs pointer events the app doesn't have, so arranging stays on the
   desktop; auto layout, tap-to-focus, the guide and the section filter all
   work from taps as they are. */
@media (max-width:760px){
  /* 100vh on iOS includes the address bar, which is the classic way an app
     shell puts its last row under the chrome. dvh tracks the visible part. */
  body{height:100dvh}

  /* The top bar becomes two DELIBERATE rows rather than whatever flex-wrap
     felt like. Row one is identity and app chrome: brand, nav, theme, Help.
     Row two is the document: File, which patch, its name, Share. The break
     between them is a full-width pseudo-element; items after it are sent
     there by order. Dropped entirely: the rules (meaningless once wrapped),
     the save-state text, and the standalone Export SVG button, which is the
     first item in Share. */
  #top{flex-wrap:wrap; row-gap:6px; padding:6px 10px}
  #top .vrule, #pstate, #stat, #bsvg, #top h1{display:none}
  #top::after{content:""; width:100%; height:0; order:1}
  #top > *{flex-shrink:0}
  #top .menu.left, #plist, #pname, #top .menu:has(#bpb){order:2}
  #plist{max-width:34%; flex-shrink:1}
  #pname{flex:1 1 80px; min-width:80px}

  #cols{flex-direction:column}
  #hsplit, #vsplit{display:none !important}
  /* Inline widths from the pane-focus code lose to these on purpose. */
  #right{order:-1; min-width:0; flex:1 1 58%; min-height:0}
  #left{order:1; width:100% !important; flex:0 0 42%; min-height:0;
    border-right:none; border-top:1px solid var(--line)}
  #left h2{margin:6px 0 2px}
  #msgs{max-height:64px}

  /* No Notes editor on a phone. The text still shows where it's read — the
     diagram footer and the guide preamble — and writing prose about a patch
     is desk work. All of its room goes to the editor. */
  #notewrap{display:none}

  /* The canvas bar keeps what a reader uses: the Diagram/Guide toggle, zoom
     in and out, one Fit, the section filter, Show all — which matters more
     here than on the desktop, since a phone has no Esc — and the expand
     button. The rest is desktop furniture: the zoom readout, 100%, the second
     Fit, the dim preference, and Auto layout, which on a phone would wreck an
     arrangement you have no way to drag back. */
  #zoombar{flex-wrap:wrap; row-gap:4px}
  #zoombar .vrule, #zoomlvl, #z100, #zfitpage, #btidy, #bdim{display:none}

  #guidewrap{padding:16px 14px}
  #veil{padding:10px}
}

@media print{
  html,body{height:auto; overflow:visible; background:#fff}
  #top,#left,#hsplit,#zoombar,#veil{display:none !important}
  #cols{display:block}
  #right{display:block !important; width:auto; border:none}
  #guidewrap,#canvaswrap{overflow:visible; padding:0}
  #guidedoc{max-width:none}
  #guidedoc h2{break-after:avoid}
  .gsteps tr,.gset tr{break-inside:avoid}
}
svg#diagram{
  background:var(--sheet); display:block; border:1px solid var(--line2);
  box-shadow:0 1px 2px var(--shadow-soft), 0 6px 18px var(--shadow-soft);
  transform-origin:top left;
}
svg#diagram .box{cursor:grab}
svg#diagram .box.dragging{cursor:grabbing}
/* Selection is drawn in CSS, not as SVG attributes, so it can't end up in an
   exported file. The SVG export carries no stylesheet and the PNG goes through
   an <img>, so both come out unmarked without anything having to remember. */
svg#diagram .box.sel > rect:first-child{ stroke:var(--accent); stroke-width:2.4 }
svg#diagram #band{ fill:var(--accent); fill-opacity:.08;
  stroke:var(--accent); stroke-width:1; stroke-dasharray:4 3 }

#veil{
  position:fixed; inset:0; background:rgba(0,0,0,.5); display:none;
  align-items:center; justify-content:center; z-index:50; padding:24px;
}
#veil.on{display:flex}
.sheet{
  background:var(--surface); border:1px solid var(--line2); border-radius:8px;
  max-width:860px; width:100%; max-height:88vh; overflow:auto; padding:18px 20px;
  box-shadow:0 18px 50px var(--shadow);
}
.sheet h3{margin:0 0 10px; font-size:15px; font-weight:650}

/* Export sheets. The act is "put this file somewhere", so the filename and the
   button come first and the reasoning waits until asked. */
.xwarn{background:var(--err-bg); color:var(--err-ink); border:1px solid var(--bad);
  border-radius:7px; padding:10px 12px; margin-bottom:14px; font-size:13px; line-height:1.5}
.xdo{font-size:14px; margin-bottom:3px}
.xdo .mono{font-weight:600}
.xwhere{color:var(--ink3); font-size:12.5px; margin-bottom:14px}
.xcount{color:var(--ink3); font-size:12px; margin-top:12px}
.xlink{background:none; border:none; color:var(--accent); padding:6px 2px;
  font-size:13px; cursor:pointer; text-decoration:underline}
.xlink:hover{background:none; filter:brightness(1.15)}
.sheet details{margin-top:16px; border-top:1px solid var(--line); padding-top:12px}
.sheet summary{cursor:pointer; color:var(--ink3); font-size:12.5px; list-style:revert}
.sheet details[open] summary{margin-bottom:8px}
.sheet details div{color:var(--ink2); font-size:12.5px; line-height:1.6; max-width:62ch}
.sheet textarea{width:100%; height:300px; font-family:var(--mono);
  font-size:11.5px; line-height:1.55}
.sheet pre{background:var(--paper); border:1px solid var(--line); border-radius:5px;
  padding:10px 12px; overflow:auto; margin:9px 0; font-size:11.5px; line-height:1.55}
.row{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:12px}
.keys{display:grid; grid-template-columns:auto 1fr; gap:7px 14px; align-items:center;
  font-size:12px; color:var(--ink2)}
</style>
</head>
<body>

<div id="top">
  <img src="img/icon.svg" alt="" width="20" height="20" id="brandmark">
  <h1>Patching</h1>
  <nav id="nav">
    <a href="index.html" class="active">Patch</a>
    <a href="modules.html">Modules</a>
    <a href="score.html">Score</a>
  </nav>
  <div class="vrule"></div>

  <!-- File first, then the document it acts on. A menu is a landmark and should
       sit in the same place whatever is open; the patch name is content and
       varies in width, so anchoring commands to the right of it would make them
       move. Same order as Figma, Docs and every menu bar. -->
  <div class="menu left">
    <button data-open>File</button>
    <div class="dropdown">
      <button id="bnew">New patch</button>
      <button id="bdup">Duplicate</button>
      <div id="exmenu"></div>
      <hr>
      <button id="bimport">Import…<small>patches.js, patch JSON or PatchBook</small></button>
      <button id="ball">Export all patches<small>Save as patches/patches.js</small></button>
      <hr>
      <button id="brevert">Revert to file<small>Discard your changes to this one</small></button>
      <button id="bdel" class="danger">Delete patch</button>
    </div>
  </div>

<!-- Plain script tags. No build step, nothing to serve. -->
<script src="lib/library.js"></script>
<script src="examples/examples.js" onerror="window.PATCH_EXAMPLES=null"></script>
<script src="patches/patches.js" onerror="void 0"></script>
<script>
(function(){
"use strict";

/* ============================================================================
   Patch documenter — flow view.

   A signal flow diagram, not a picture of the rack: boxes in signal order,
   only the jacks actually in use, cable type carried by BOTH colour and line
   style so it survives greyscale printing and colour vision deficiency.

   Source of truth for cables is the text pane on the left. Box positions are
   NOT in the text — they live in the patch object and are updated by dragging,
   so re-typing a cable never disturbs your layout.
   ========================================================================== */

/* Separate files, separate scopes, so this is duplicated in modules.html.
   Two lines is cheaper than a shared script tag for one string. */
var REPO = "https://github.com/ubertv/patching";
/* Bump in all three pages together. Shown in About, so a screenshot says which
   copy someone is running. CHANGELOG.md is what the number means. */
var VERSION = "0.1.2";

/* ---------------------------------------------------------------- libraries --- */
/*
   Every module comes from a LIBRARY. A library is a plain object pushed onto
   window.MODULE_LIBRARIES by a <script> in lib/, so adding one is dropping a
   file in and adding a tag. No build step, no bundler, no manifest.

   Load order is precedence order, last wins, and anything you create or edit in
   modules.html lives in localStorage and beats all of them. That's what makes
   the app useful to someone who doesn't own the same gear: replace the library,
   keep the tool.
*/
var LIBS = window.MODULE_LIBRARIES || [];

var LSKEY      = "patching-patches-v1";
var LS_MODULES = "patching-modules-v1";
/* Superseded, read once as a fallback. See modules.html. */
var LS_CUSTOM  = "patching-custom-modules-v1";
var LS_PALETTE = "patching-palette-v1";
var LS_EDITS   = "patching-library-edits-v1";

/* Firefox throws on localStorage for file:// pages rather than returning null,
   so every read is wrapped. The app is fully usable without storage — it just
   can't remember patches between sessions, and says so. */
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
var STORAGE_OK = (function(){
  try { localStorage.setItem("patching-probe","1"); localStorage.removeItem("patching-probe"); return true; }
  catch(e){ return false; }
})();

/* Everything modules.html has changed, in one map keyed by id: modules you
   made, corrections to shipped ones, and which are switched off. A module you
   invented is simply an override with nothing underneath it. Same model the
   patches use. */
var OVER = (function(){
  var v = null;
  try { v = JSON.parse(lsGet(LS_MODULES)); } catch(e){}
  if (v) return v;
  /* Nothing under the new key means an older browser state, or none at all.
     Fold the three old keys the same way modules.html does. */
  var out = {};
  try { var e = JSON.parse(lsGet(LS_EDITS)) || {}; for (var id in e) out[id] = e[id]; } catch(e){}
  try { (JSON.parse(lsGet(LS_CUSTOM)) || []).forEach(function(m){ if (m && m.id) out[m.id] = m; }); } catch(e){}
  try {
    var p = JSON.parse(lsGet(LS_PALETTE));
    ((p && p.hidden) || []).forEach(function(id){
      if (!out[id]) out[id] = { id:id };
      out[id].off = true;
    });
  } catch(e){}
  return out;
})();

var MODMAP = {}, MODS = [];
function addModule(m, libId, libName){
  var c = {};
  for (var k in m) c[k] = m[k];
  c.lib = libId; c.libName = libName;
  if (MODMAP[c.id]) MODS.splice(MODS.indexOf(MODMAP[c.id]), 1);
  MODMAP[c.id] = c; MODS.push(c);
}
/* MERGED, not replaced: an override is a set of differences and may hold only
   one of them. Switching a module off writes `{id, off:true}` and nothing else,
   so replacing would leave a husk with no name and no jacks. */
LIBS.forEach(function(L){ (L.modules||[]).forEach(function(m){
  var o = OVER[m.id], merged = m;
  if (o){ merged = {}; for (var k in m) merged[k] = m[k]; for (k in o) merged[k] = o[k]; }
  addModule(merged, L.id, L.name);
  if (o) MODMAP[m.id].edited = true;
}); });
/* Overrides with no file underneath are modules you made. */
Object.keys(OVER).forEach(function(id){
  if (!MODMAP[id]) addModule(OVER[id], "yours", "Yours");
});

/* Which modules the autocomplete offers. Hiding is COSMETIC: a hidden module
   still parses, still validates and still draws, so trimming the list can never
   break a patch that already references one.

   `off` rides on the override, so an exported lib/library.js carries it and a
   fresh browser gets the same list. An older file with a separate
   MODULE_PALETTE still works, but only when storage has nothing to say. */
var HIDDEN = {};
(function(){
  var any = false;
  Object.keys(OVER).forEach(function(id){ if (OVER[id] && OVER[id].off){ HIDDEN[id] = 1; any = true; } });
  if (any) return;
  ((window.MODULE_PALETTE && window.MODULE_PALETTE.hidden) || [])
    .forEach(function(id){ HIDDEN[id] = 1; });
})();

/* Kept so the rest of the file reads the same as before the split. */
var M = MODS;
var CLASH = [];

function jacksFor(id){ var m = MODMAP[id]; return m ? (m.jacks || []) : null; }
function noJacks(id){ var m = MODMAP[id]; return !!(m && m.noJacks); }
function byId(id){ return MODMAP[id] || null; }
function allModules(){ return MODS; }
function jack(mid, jid){
  var js = jacksFor(mid); if (!js) return null;
  for (var i=0;i<js.length;i++) if (js[i].id===jid) return js[i];
  return null;
}

/* Colour AND line style. The dash patterns are as distinguishable from each
   other in black and white as the colours are in colour — that's the whole
   point, these get printed. */
/* Cable colours in both themes. `c` is the live one, set by applyTheme().
   The light set is chosen for print on white; the dark set is lifted so it
   still separates against a dark sheet without glowing. Line style carries the
   type as well, so either set survives greyscale. */
/* ------------------------------------------------------------------ theme ---
   Stored per browser, shared by all three pages, and set on <html> before the
   first paint by a tiny inline script in <head> so the page never flashes the
   wrong one. No stored choice means follow the operating system.

   The DIAGRAM follows the theme too, but every export forces light: an SVG
   pasted into a forum or sent to a printer has to be dark-on-white whatever the
   interface happened to be set to. */
var LS_THEME = "patching-theme-v1";
function prefersDark(){
  return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
}
function applyTheme(t){
  THEME = t; TH = THEMES[t] || THEMES.light;
  for (var k in SIG) SIG[k].c = (t === "dark") ? SIG[k].dc : SIG[k].lc;
  document.documentElement.setAttribute("data-theme", t);
}

var SIG = {
  audio: { lc:"#b5322c", dc:"#e8736c", d:"",            n:"audio" },
  pitch: { lc:"#2f5fd0", dc:"#7ba4ff", d:"14 6",        n:"pitch CV" },
  cv:    { lc:"#158f7d", dc:"#4fc4ac", d:"2 5",         n:"modulation CV" },
  gate:  { lc:"#7b3fbf", dc:"#b48ae8", d:"6 4",         n:"gate / trigger" },
  clock: { lc:"#a8760a", dc:"#d9a63f", d:"12 4 2 4",    n:"clock" },
  multi: { lc:"#5f6873", dc:"#98a1ad", d:"9 3 1 3 1 3", n:"undeclared" }
};

/* Everything else the renderer puts on the sheet. */
var THEMES = {
  light: { sheet:"#ffffff", ink:"#111", ink2:"#555", ink3:"#777", faint:"#888",
           rule:"#222", hair:"#ccc", hair2:"#ddd", knock:"#ffffff",
           gen:"#444", genfill:"#f5f5f2", nofill:"#eceef1", role:"#4a4a4a",
           bad:"#e0605e", head:"#f3f3f1" },
  dark:  { sheet:"#1a1c1f", ink:"#e9e7e2", ink2:"#a8a39b", ink3:"#8b867e", faint:"#7e7970",
           rule:"#5a6068", hair:"#3b4046", hair2:"#31363b", knock:"#1a1c1f",
           gen:"#9a958d", genfill:"#212427", nofill:"#242830", role:"#c9c5be",
           bad:"#e2726b", head:"#212326" }
};
var THEME = "light", TH = THEMES.light;
var SIGORDER = ["audio","pitch","cv","gate","clock","multi"];

/* Module categories, and the wash of colour each one puts behind a box title.

   Same list as modules.html groups by, deliberately — one vocabulary for "what
   kind of thing is this", whether you're browsing the library or reading a
   diagram.

   These are a SCANNING AID, not a code to decode. They help you find the
   oscillators at a glance in a patch of twenty boxes; they never carry
   information the diagram doesn't already state in words, because the module's
   own name says what it is. That's why there's no legend for them, and why
   they're this pale: every tint sits at roughly 94% lightness, so it prints as
   near-white and can't muddy the cable colours, which ARE load-bearing.

   Three of them echo the cable colour of the signal they deal in — sources
   warm like audio, modulation teal like CV, timing amber like clock — because
   where the meanings line up, agreeing is better than being arbitrary.

   To turn the whole thing off, return null from catFill(). */
var CATS = [
  ["Sound sources",       ["oscillator","drum","noise","granular","sampler","voice"], "#f9e9e6", "#33262a"],
  ["Filters & shaping",   ["filter","wavefolder"],                                    "#f6e9f3", "#31263a"],
  ["Modulation",          ["lfo","envelope","random","modulation"],                   "#e4f1ec", "#1d3230"],
  ["Sequencing & timing", ["sequencer","clock","quantizer","controller"],             "#fdf1dd", "#332c1c"],
  ["Mixing & VCAs",       ["vca","mixer"],                                            "#e7eff9", "#1f2b3c"],
  ["Effects",             ["delay","reverb","effect"],                                "#efeafa", "#282540"],
  ["Utilities",           ["utility","passive","expander","midi","power"],            "#eeeff0", "#26292d"],
  ["Output",              ["output"],                                                 "#e9f2e2", "#233020"]
];
var CATOTHER = ["#f3f3f1", "#212326"];

/* THE FIRST TAG WINS, not the first category.

   Modules do several things and their tags say so, but a box gets one colour.
   Walking the tags in order and taking the first that maps anywhere makes tag
   order the module's own statement of what it mainly is — so Clouds tagged
   ["effect","granular"] reads as an effect while arbhar tagged ["granular",…]
   reads as a sound source, without either of them needing a special case.

   Walking the categories instead, as this used to, meant the CATS order decided
   for every module at once: Pam's landed in Modulation rather than Sequencing
   because Modulation happens to be listed first, and no amount of tagging could
   fix it. */
function catOf(m){
  var t = ((m && m.tags) || []).map(function(x){ return String(x).toLowerCase(); });
  for (var k = 0; k < t.length; k++)
    for (var i = 0; i < CATS.length; i++)
      if (CATS[i][1].indexOf(t[k]) !== -1) return CATS[i];
  return null;
}
function catFill(m){
  var i = THEME === "dark" ? 3 : 2, c = catOf(m);
  return c ? c[i] : CATOTHER[THEME === "dark" ? 1 : 0];
}

/* -------------------------------------------------------------- patch state --- */

/*
   Patches are kept exactly the way modules are, and for the same reasons.

     patches/patches.js   the durable copy. A plain <script src>, so it loads
                          identically off a filesystem, off localhost and off a
                          web host. Picked up automatically at boot.
     browser storage      the working copy. Instant, but one browser, one machine.
     Export / Import      the bridge between the two.

   A patch that exists in both places is ONE patch, matched by id, and the
   stored copy wins. That's what makes the round trip safe: export your work,
   drop the file in, and nothing duplicates — the file becomes the baseline
   underneath the copy you already had.

   The override is also self-cancelling. save() writes to storage only while
   the patch actually differs from the file, so merely opening a patch from a
   file doesn't shadow it, and editing one back to matching drops the override
   on its own. Pull a newer patches.js and you get the newer version of
   everything you haven't touched.
*/
var PATCH_FILES = window.PATCH_FILES || [];
var FILEP = {};          /* id -> the file's copy, never mutated */
var FILEORDER = [];      /* file ids, in the order the files declare them */
PATCH_FILES.forEach(function(F){
  (F.patches || []).forEach(function(p){
    if (!p || !p.id) return;
    if (!FILEP[p.id]) FILEORDER.push(p.id);
    FILEP[p.id] = p;     /* a later file wins, same as libraries */
  });
});

var parsed = { cables: [], errors: [], params: {}, voices: [] };
var pendingLayout = false;   /* set by the Auto layout command, consumed by build() */
var view = { nodes: [], edges: [], w: 0, h: 0 };
var state = { voice: "" };   /* section filter. Fades what is outside it, never removes it */

/* Date.now() alone collides if two patches are made in the same millisecond,
   which "import a file of twenty" does every time. */
var idSeq = 0;
function newPatch(){
  return { id: "p" + Date.now().toString(36) + (idSeq++ ? "-" + idSeq : ""),
           name: "Untitled patch", src: "", pos: {}, notes: "" };
}
function clonePatch(p){
  return { id: p.id, name: p.name || "Untitled patch", src: p.src || "",
           pos: JSON.parse(JSON.stringify(p.pos || {})), notes: p.notes || "" };
}

/* Every patch the app knows about, file ones first, then storage-only ones in
   the order they were made. Storage shadows the file entry rather than sitting
   beside it. */
function patchIds(){
  var seen = {}, out = [];
  FILEORDER.forEach(function(id){ seen[id] = 1; out.push(id); });
  Object.keys(store.patches).forEach(function(id){ if (!seen[id]) out.push(id); });
  return out;
}
function allPatches(){ return patchIds().map(getPatch); }
function getPatch(id){
  if (store.patches[id]) return store.patches[id];
  if (FILEP[id]) return clonePatch(FILEP[id]);
  return null;
}
function fromFile(id){ return !!FILEP[id]; }
function isEdited(id){ return !!(FILEP[id] && store.patches[id]); }

/* What counts as "the same patch". Positions are compared with sorted keys and
   rounded values, because dragging a box a subpixel shouldn't register as an
   edit and object key order isn't something to depend on. */
function canon(p){
  var pos = p.pos || {}, o = {};
  Object.keys(pos).sort().forEach(function(k){
    o[k] = [Math.round(pos[k].x || 0), Math.round(pos[k].y || 0)];
  });
  return JSON.stringify([p.name || "", p.src || "", p.notes || "", o]);
}

/* First run with no file and no storage still has to produce a patch to type
   into, and that one is registered straight away so the list is never empty. */
function currentPatch(){
  var p = getPatch(store.current);
  if (p) return p;
  var ids = patchIds();
  if (ids.length) return getPatch(ids[0]);
  var np = newPatch(); store.patches[np.id] = np; return np;
}

function save(){
  if (FILEP[patch.id] && canon(patch) === canon(FILEP[patch.id]))
    delete store.patches[patch.id];        /* identical to the file: no override needed */
  else
    store.patches[patch.id] = patch;
  store.current = patch.id;
  try { localStorage.setItem(LSKEY, JSON.stringify(store)); }
  catch(e){ msg("err", "Couldn't save. Storage is full, or this is a private window."); }
}

/* Switching to a patch is always these five lines, and getting one of them
   wrong is how notes went missing on import. */
function showPatch(p){
  patch = p; store.current = p.id;
  document.getElementById("src").value = p.src || "";
  document.getElementById("pname").value = p.name || "";
  document.getElementById("notes").value = p.notes || "";
}

function loadStore(){
  try {
    var s = JSON.parse(lsGet(LSKEY) || "null");
    if (s && s.patches) return s;
  } catch(e){}
  return { patches:{}, current:null };
}

var store = loadStore();
var patch = currentPatch();

/* ------------------------------------------------------------------ parsing --- */
/*
   One cable per line:

     module:jack -> module:jack
     module:jack -> module:jack [audio]
     module:jack -> module:jack [gate] "note text"
     # comments and blank lines are ignored

   The [sig] tag is optional, and REQUIRED only when an endpoint is a `multi`
   jack — because that's exactly the case where the jack can't tell you what
   the cable is carrying.
*/
/* Typed arrows, borrowed from PatchBook so a patch reads the same either way.
   NOTE THE ONE DELIBERATE DIFFERENCE: in PatchBook `->` means audio. Here it
   stays neutral — the source jack decides — because that behaviour predates this
   and because a neutral connector is genuinely useful when you don't want to
   assert a type. The PatchBook importer translates their `->` to an explicit
   [audio] tag so nothing is lost in translation. */
var ARROWS = {
  ">>": "cv", "p>": "pitch", "g>": "gate", "t>": "gate", "c>": "clock",
  "->": null, "→": null, ">": null
};

function parse(text){
  var out = { cables: [], errors: [], params: {}, voices: [] };
  var voice = "", lastParamMod = null;

  text.split(/\n/).forEach(function(raw, i){
    var ln = i + 1;
    /* Comments: # or // at line start or after whitespace. A # tight against the
       preceding character is the instance marker — vco#2 — so it must survive. */
    var line = raw.replace(/(^|\s)(#|\/\/).*$/, "").trim();
    /* A parameter block is the `*` header plus the `|` lines directly under it,
       and a BLANK line ends it. Without this, a `|` line bound to a header any
       distance above, which made its meaning depend on layout nowhere near it.
       A comment-only line stays transparent: annotating inside a block is
       legitimate, so only genuine whitespace terminates. */
    if (!line){
      if (!raw.trim()) lastParamMod = null;
      return;
    }

    /* Voice header: a bare NAME: with no arrow and no leading marker. */
    if (/^[^*|\-].*:$/.test(line) && !/(->|>>|→|[pgtc]>)/.test(line)){
      voice = line.slice(0, -1).trim();
      if (voice && out.voices.indexOf(voice) === -1) out.voices.push(voice);
      lastParamMod = null;
      return;
    }

    /* Parameters: "* module: knob = 40% | knob = 3" or a bare "* module:"
       followed by "| knob = value" continuation lines. */
    var pm = line.match(/^\*\s*([^:]+):\s*(.*)$/);
    if (pm){
      var pmod = pm[1].trim();
      /* Parameter blocks accept a display name too, so "* Ripples:" and
         "* vcf:" both land on the same box. */
      if (!byId(pmod.replace(/#[a-z0-9\-]+$/i, ""))){
        var lower = pmod.toLowerCase();
        var byName = allModules().filter(function(x){
          return x.name.toLowerCase() === lower; })[0];
        if (byName) pmod = byName.id;
        else {
          /* "VCO 2" is how PatchBook writes a second instance, and connections
             already accept it. Parameters have to as well, or `- VCO 2 (SAW) ...`
             and `* VCO 2:` would disagree about which box they mean. */
          var im = lower.match(/^(.*?)\s+(\d+)$/);
          if (im){
            var base = allModules().filter(function(x){
              return x.name.toLowerCase() === im[1] || x.id === im[1]; })[0];
            if (base) pmod = base.id + "#" + im[2];
          }
        }
      }
      lastParamMod = pmod;
      if (!byId(pmod.replace(/#[a-z0-9\-]+$/i, "")))
        out.errors.push({ line:ln, text:raw, msg:"Parameters for unknown module <b>"+esc(pmod)+"</b>. "+
          near(pmod.toLowerCase(), allModules().map(function(x){ return x.id; })) });
      /* Unconditional: addParams decides what an empty block means, so there's
         one place that knows rather than two that have to agree. */
      addParams(out, pmod, pm[2], ln);
      return;
    }
    if (/^\|/.test(line)){
      if (!lastParamMod){
        out.errors.push({ line:ln, text:raw, msg:"Parameter line with no block to join. "+
          "Start with <span class='mono'>* module:</span> and keep <span class='mono'>|</span> lines "+
          "directly under it — a blank line ends the block." });
        return;
      }
      addParams(out, lastParamMod, line.replace(/^\|\s*/, ""), ln);
      return;
    }

    /* Connection. Leading "- " is accepted so PatchBook lines paste in cleanly. */
    line = line.replace(/^-\s+/, "");
    var note = "";
    line = line.replace(/"([^"]*)"\s*$/, function(_, n){ note = n; return ""; }).trim();
    var sig = null;
    line = line.replace(/\[\s*([a-z]+)\s*\]\s*$/i, function(_, s){ sig = s.toLowerCase(); return ""; }).trim();

    /* `to` is a plain-English spelling of `->`, for when a patch is being
       dictated or typed by someone who doesn't want to reach for symbols.
       Identical meaning: neutral, the source jack decides the type.

       Two guards. It only applies when the line has no symbol arrow, so a
       module actually called "Back To Basics" is never mistaken for a
       connection. And it needs whitespace both sides, so ids that merely
       contain the letters — photo, auto-pan, in-to-out — are untouched.
       Rewriting to `->` here means everything downstream, including export,
       sees one canonical form. */
    if (!/(->|>>|[pgtc]>|→|>)/.test(line))
      line = line.replace(/\s+to\s+/gi, " -> ");

    /* Split into endpoints and the arrows between them, so one line can be a
       chain: A -> B -> C is two cables, and B is a destination on the first and
       a source on the second. Each hop keeps its own arrow, so you can change
       type mid-chain: seq:cv p> vco -> vcf. */
    var parts = line.split(/\s*(->|>>|[pgtc]>|→|>)\s*/);
    if (parts.length < 3){
      out.errors.push({ line:ln, text:raw, msg:"Can't read this as a connection. Expected <span class='mono'>module:jack -&gt; module:jack</span>." });
      return;
    }
    if (sig && !SIG[sig]){
      out.errors.push({ line:ln, text:raw, msg:"Unknown signal type <b>"+esc(sig)+"</b>. Use one of "+SIGORDER.join(", ")+"." });
      sig = null;
    }

    /* One output feeding several inputs, written the way you'd say it:
         env:out >> vca:cv and vcf:cutoff
       Only allowed on the LAST hop. "a -> b and c -> d" has two readings and
       neither is obviously right, so we refuse it rather than pick. */
    var hops = [];
    for (var h = 1; h < parts.length; h += 2)
      hops.push({ arrow: parts[h], src: parts[h-1], dst: parts[h+1] });

    var bad = false;
    hops.forEach(function(hop, i){
      if (i < hops.length - 1 && /\s+and\s+|,/.test(hop.dst)){
        out.errors.push({ line:ln, text:raw, msg:"<span class='mono'>and</span> only works on the "+
          "last step of a line. Split the chain across two lines." });
        bad = true;
      }
    });
    if (bad) return;

    /* A chain's middle endpoint is written once but plays two parts, and they
       are DIFFERENT JACKS: it arrives at an input and leaves by an output.

       Three ways to say which output it leaves by, in increasing explicitness:

         delay:in -> …     the default output, if the module has an obvious one
         delay     -> …    both ends defaulted
         delay:in:mix      say both: arrive at IN, leave by MIX

       The three-part form is what makes a chain usable on anything with more
       than one output — a delay with DRY and WET, a filter with LP, BP and HP.
       Without it those modules could only ever appear at the end of a line.

       It's meaningless anywhere but the middle, so saying it on the first or
       last endpoint is an error rather than something quietly ignored. */
    function split3(text){
      var m = String(text).trim().match(
        /^([a-z0-9\-]+(?:#[a-z0-9\-]+)?)\s*:\s*([a-z0-9\-]+)\s*:\s*([a-z0-9\-]+)$/i);
      return m ? { mod:m[1], inJack:m[2], outJack:m[3] } : null;
    }
    var segs = [];
    for (var g = 0; g < parts.length; g += 2) segs.push(parts[g]);

    var misplaced = false;
    segs.forEach(function(seg, i){
      var t = split3(seg);
      if (!t) return;
      if (i === 0 || i === segs.length - 1){
        out.errors.push({ line:ln, text:raw, msg:"<span class='mono'>"+esc(t.mod)+":"+esc(t.inJack)+
          ":"+esc(t.outJack)+"</span> names an input and an output, which only makes sense for a "+
          "module in the <i>middle</i> of a chain. "+(i === 0
            ? "At the start it is only a source. Write <span class='mono'>"+esc(t.mod)+":"+esc(t.outJack)+"</span>."
            : "At the end it is only a destination. Write <span class='mono'>"+esc(t.mod)+":"+esc(t.inJack)+"</span>.") });
        misplaced = true;
      }
    });
    if (misplaced) return;

    hops.forEach(function(hop, i){
      var srcSeg = segs[i], three = split3(srcSeg);
      var srcText;
      if (three) srcText = three.mod + ":" + three.outJack;
      else if (i === 0) srcText = srcSeg;
      else {
        /* Carry the module, not the jack — the next hop leaves by a different
           socket, so let the default-output rule pick it. */
        var mm = String(srcSeg).match(/^\s*([a-z0-9\-]+(?:#[a-z0-9\-]+)?)\s*(?::|$|\()/i);
        srcText = mm ? mm[1] : srcSeg;
      }
      var a = endpoint(srcText, ln, out, "out");

      var dstSeg = segs[i+1], dthree = split3(dstSeg);
      var dsts = (i === hops.length - 1)
        ? String(dstSeg).split(/\s+and\s+|\s*,\s*/i).map(function(x){ return x.trim(); }).filter(Boolean)
        : [dthree ? dthree.mod + ":" + dthree.inJack : dstSeg];

      var arrowSig = ARROWS[hop.arrow];
      dsts.forEach(function(dtext){
        var b = endpoint(dtext, ln, out, "in");
        if (!a || !b) return;
        out.cables.push({ from:a, to:b, sig: sig || arrowSig, note:note, line:ln,
                          voice: voice, arrow: hop.arrow });
      });
    });
    lastParamMod = null;
  });
  return out;
}

function addParams(out, mod, str, ln){
  /* A bare `* vco:` places the module and says nothing about it. Worth having:
     it's how you put something on the page to think about before you've decided
     what it connects to, and it gives every module a home in the text, which is
     where a settings dialog would later have to write. Registering the key with
     no parameters is enough — build() gives anything in `params` a box. */
  if (!str.trim()){ out.params[mod] = out.params[mod] || []; return; }
  str.split("|").forEach(function(chunk){
    chunk = chunk.trim(); if (!chunk) return;
    var eq = chunk.indexOf("=");
    if (eq === -1){
      out.errors.push({ line:ln, text:chunk, msg:"Parameter <span class='mono'>"+esc(chunk)+
        "</span> needs a value: <span class='mono'>name = value</span>." });
      return;
    }
    (out.params[mod] = out.params[mod] || []).push({
      name: chunk.slice(0, eq).trim(), value: chunk.slice(eq+1).trim(), line: ln });
  });
}
/* Which jack you meant when you didn't say.

   Two rules, in order, and NEITHER of them is a guess:

     1. a jack whose id is exactly `out`/`in` (or the first of a numbered or
        stereo pair) — that's a naming convention already present in the data,
        so we're reading it, not inventing it;
     2. failing that, the only jack facing the right way — arithmetic.

   Anything else returns null and the caller reports it with the candidates
   listed. A VCO has saw, tri, sine, square and sub: picking one for you would
   be exactly the sort of quiet guess this tool exists not to make.

   It resolves for 39 of the 50 shipped modules on the output side and 28 on the
   input side, which is enough to be worth having and not enough to rely on. */
function defaultJack(mid, dir){
  var js = jacksFor(mid); if (!js) return null;
  var cands = js.filter(function(j){ return dir === "out" ? j.dir !== "in" : j.dir !== "out"; });
  if (!cands.length) return null;
  var conventional = cands.filter(function(j){
    return j.id === dir || j.id === dir+"-1" || j.id === dir+"-l";
  });
  if (conventional.length === 1) return conventional[0].id;
  if (cands.length === 1) return cands[0].id;
  return null;
}

function endpoint(s, ln, out, dir){
  s = s.trim();

  /* A bare module name — no jack, no port label. Only legal if the default
     resolves; otherwise say so and list what it could have been. */
  if (/^[a-z0-9\-]+(?:#[a-z0-9\-]+)?$/i.test(s)){
    var bm = s.match(/^([a-z0-9\-]+)(?:#([a-z0-9\-]+))?$/i);
    if (byId(bm[1])){
      var d = defaultJack(bm[1], dir);
      if (d) s = bm[1] + (bm[2] ? "#"+bm[2] : "") + ":" + d;
      else {
        var js0 = jacksFor(bm[1]) || [];
        var opts = js0.filter(function(j){ return dir === "out" ? j.dir !== "in" : j.dir !== "out"; })
                      .map(function(j){ return j.id; });
        out.errors.push({ line:ln, text:s, msg:"<b>"+esc(bm[1])+"</b> has "+
          (opts.length ? "no obvious "+(dir==="out"?"output":"input")+". Say which: <span class='mono'>"+
            esc(opts.join(", "))+"</span>"
                       : "no "+(dir==="out"?"outputs":"inputs")+" at all.") });
        return null;
      }
    }
  }

  /* PatchBook form: Module Name (Port Label). Accepted anywhere our own
     module:jack form is, and mixed freely with it. This costs nothing in
     validation — the label is resolved against the same jack data, scoped by
     direction, which is why it lands on one answer nearly every time. */
  var pb = s.match(/^(.+?)\s*\(\s*(.+)\s*\)$/);
  if (pb){
    var rep = { unmatched:[], unmatchedJacks:[], ambiguous:[], triggers:0, lines:0 };
    var res = pbResolve(pb[1], pb[2], dir, rep);
    if (res){
      if (rep.ambiguous.length)
        out.errors.push({ line:ln, text:s, msg:"<span class='mono'>"+esc(s)+
          "</span> is ambiguous: "+esc(rep.ambiguous[0])+". Use the id form to say which." });
      s = res;
    } else if (rep.unmatched.length){
      out.errors.push({ line:ln, text:s, msg:"No module named <b>"+esc(rep.unmatched[0])+"</b>. "+
        near(rep.unmatched[0].toLowerCase(), allModules().map(function(x){ return x.name.toLowerCase(); })) });
      return null;
    } else {
      out.errors.push({ line:ln, text:s, msg:"<b>"+esc(pb[1].trim())+"</b> has no "+
        (dir==="out"?"output":"input")+" labelled <b>"+esc(pb[2].trim())+"</b>." });
      return null;
    }
  }

  var m = s.match(/^([a-z0-9\-]+)(?:#([a-z0-9\-]+))?\s*:\s*(.+)$/i);
  if (!m){
    out.errors.push({ line:ln, text:s, msg:"<span class='mono'>"+esc(s)+
      "</span> isn't <span class='mono'>module:jack</span> or <span class='mono'>Module Name (Port Label)</span>." });
    return null;
  }
  var mid = m[1], inst = m[2] || null, jid = m[3].trim();
  if (!byId(mid)){
    out.errors.push({ line:ln, text:s, msg:"No module <b>"+esc(mid)+"</b>. "+
      near(mid, allModules().map(function(x){return x.id;})) });
    return null;
  }
  var js = jacksFor(mid);
  if (!js){
    out.errors.push({ line:ln, text:s, msg:"<b>"+esc(mid)+"</b> has no jack data yet. Build it in <span class='mono'>annotate-jacks.html</span> first." });
    return null;
  }
  if (noJacks(mid)){
    out.errors.push({ line:ln, text:s, msg:"<b>"+esc(mid)+"</b> is marked as having no patch jacks." });
    return null;
  }
  if (!jack(mid, jid)){
    out.errors.push({ line:ln, text:s, msg:"<b>"+esc(mid)+"</b> has no jack <b>"+esc(jid)+"</b>. "+near(jid, js.map(function(x){return x.id;})) });
    return null;
  }
  return { mod:mid, inst:inst, jack:jid, key: mid + (inst?("#"+inst):"") };
}
/* Cheap edit-distance suggestion — enough to catch a typo, not trying to be clever. */
function near(s, list){
  var best = null, bd = 1e9;
  list.forEach(function(c){
    var d = lev(s, c);
    if (d < bd){ bd = d; best = c; }
  });
  return (best && bd <= Math.max(2, Math.ceil(s.length/3)))
    ? "Did you mean <span class='mono'>"+esc(best)+"</span>?" : "";
}
function lev(a,b){
  var m=a.length,n=b.length,d=[],i,j;
  for(i=0;i<=m;i++){d[i]=[i];}
  for(j=0;j<=n;j++){d[0][j]=j;}
  for(i=1;i<=m;i++) for(j=1;j<=n;j++)
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[m][n];
}

/* --------------------------------------------------------------- signal type --- */
/*
   THE SOURCE DECIDES WHAT'S ON THE WIRE.

   A clock output emits a clock whether it lands in a clock input, an envelope's
   gate input or a filter's cutoff. The destination's expectation doesn't change
   the signal, so a mismatch between the two ends is not a problem to report —
   it's just ordinary patching. An LFO into V/OCT is vibrato. A gate into a CV
   input is a stepped voltage. Audio into a CV input is audio-rate modulation.
   None of that is worth a warning, and an earlier version of this file warned on
   81% of every possible connection in the rack, which is the same as warning on
   nothing.

   So, in order:
     1. an explicit [type] tag always wins
     2. otherwise the source jack's type, if it has a concrete one
     3. otherwise the destination's, since a type-agnostic output plugged into a
        specific input is being used as that type
     4. otherwise unknown, and resolveTypes() below tries to work it out from
        what's flowing into the source module
*/
function cableSig(c){
  if (c.sig) return c.sig;
  var a = jack(c.from.mod, c.from.jack), b = jack(c.to.mod, c.to.jack);
  var as = a ? a.sig : "multi", bs = b ? b.sig : "multi";
  if (as !== "multi") return as;
  if (bs !== "multi") return bs;
  return null;
}

/* Multi-to-multi is the only genuinely undetermined case: a VCA output into a
   mixer input tells you nothing on its own. But if we know what went INTO that
   VCA, we know what's coming out. Propagate forward through type-agnostic
   modules until nothing more resolves. This is what lets an audio chain of
   VCA -> mixer -> output colour itself correctly without a single [type] tag. */
function resolveTypes(edges){
  var guessed = 0;
  for (var pass = 0; pass < 8; pass++){
    var changed = 0;
    edges.forEach(function(e){
      if (e.sig) return;
      /* Follow the THROUGH-path only: cables arriving at a type-agnostic jack.
         A cable into a jack that already declares a type is a control input, not
         the signal passing through. Without this a VCA never resolves, because
         it always has audio at IN and CV at CV, and "is the inbound type
         unambiguous" is permanently no — which is the single most common
         type-agnostic module in a modular system. */
      var inbound = edges.filter(function(o){
        if (o === e || o.to.key !== e.from.key || !o.sig) return false;
        var dj = jack(o.to.mod, o.to.jack);
        return dj && dj.sig === "multi";
      });
      var types = {};
      inbound.forEach(function(o){ types[o.sig] = 1; });
      var keys = Object.keys(types);
      /* Only adopt when the answer is unambiguous. Two different signal types
         arriving on the through-path means we'd be picking one at random. */
      if (keys.length === 1){ e.sig = keys[0]; e.inferredSig = true; changed++; guessed++; }
    });
    if (!changed) break;
  }
  return guessed;
}

/* ------------------------------------------------------------ stereo pairing --- */
/* "INPUT 1 L" / "INPUT 1 R" -> {base:"INPUT 1", side:"L"}. Only a standalone
   L or R token counts, so LEVEL and CLR don't get mangled. */
function stereo(label){
  var m = String(label).match(/(^|[\s\(\[])([LR])($|[\s\)\]])/);
  if (!m) return null;
  var i = m.index + m[1].length;
  return { side: m[2], base: (label.slice(0,i) + " " + label.slice(i+1)).replace(/\s+/g," ").trim() };
}
/* Two cables merge into one drawn edge when they run between the same two
   modules and both ends are matching L/R partners. The patch still stores two
   cables — this is purely how it's drawn. */
function pairUp(cables){
  var used = {}, edges = [];
  cables.forEach(function(c, i){
    if (used[i]) return;
    var fs = stereo(jack(c.from.mod,c.from.jack).label),
        ts = stereo(jack(c.to.mod,c.to.jack).label);
    if (fs && ts && fs.side === ts.side){
      for (var k=i+1;k<cables.length;k++){
        if (used[k]) continue;
        var o = cables[k];
        if (o.from.key !== c.from.key || o.to.key !== c.to.key) continue;
        var ofs = stereo(jack(o.from.mod,o.from.jack).label),
            ots = stereo(jack(o.to.mod,o.to.jack).label);
        if (!ofs || !ots) continue;
        if (ofs.base === fs.base && ots.base === ts.base &&
            ofs.side === ots.side && ofs.side !== fs.side){
          used[i] = used[k] = 1;
          edges.push({ cables:[c,o], stereo:true, from:c.from, to:c.to,
                       base: fs.base, toBase: ts.base });
          return;
        }
      }
    }
    used[i] = 1;
    edges.push({ cables:[c], stereo:false, from:c.from, to:c.to });
  });
  return edges;
}

/* --------------------------------------------------------------- geometry ----- */

var BOXW = 186, HEADH = 30, ROWH = 19, PADV = 9, GAPX = 96, GAPY = 40;
/* How far the section filter fades what it is not showing. Faint enough to
   recede, solid enough to still read the module name off it. */
var DIM = 0.18;
var NOTE_SIZE = 10.5, NOTE_LEAD = 14;
var PARAMH = 13, PARAMPAD = 8;

function build(){
  patch.src = document.getElementById("src").value;
  parsed = parse(patch.src);
  paintVoices();
  /* The section filter DIMS, it does not remove.
     It used to filter the cable list, which dropped modules out of the graph
     entirely and relaid the whole diagram, so picking a section looked like
     modules vanishing at random. A module shared with another section
     disappeared depending on which header its cable happened to sit under.
     Everything is drawn every time now, so the layout never moves. */
  var allCables = parsed.cables;

  /* Nodes in first-seen order — that ordering is yours, it comes from the
     order you typed the cables, which is usually signal order already. */
  var nodes = {}, order = [];
  parsed.cables.forEach(function(c){
    [c.from, c.to].forEach(function(e){
      if (!nodes[e.key]){
        nodes[e.key] = { key:e.key, mod:e.mod, inst:e.inst, ins:[], outs:[] };
        order.push(e.key);
      }
    });
  });
  parsed.cables.forEach(function(c){
    addPort(nodes[c.from.key], c.from.jack, "outs");
    addPort(nodes[c.to.key],   c.to.jack,   "ins");
  });

  /* Parameters attach to the module box. Keyed by whatever you wrote, so both
     `* vco:` and `* vco#2:` work, and a module with no cables but with settings
     worth recording still gets a box. */
  Object.keys(parsed.params).forEach(function(k){
    if (!nodes[k]){
      var base = k.replace(/#[a-z0-9\-]+$/i, ""), inst = (k.match(/#([a-z0-9\-]+)$/i)||[])[1];
      if (!byId(base)) return;
      nodes[k] = { key:k, mod:base, inst: inst || null, ins:[], outs:[] };
      order.push(k);
    }
    nodes[k].params = parsed.params[k];
  });

  /* Size first: the layout needs real box heights, and heights depend on how
     many ports and parameters a module ended up with. */
  var list = order.map(function(k){ return nodes[k]; });
  assignVoices(list, parsed.cables);
  list.forEach(function(n){
    var rows = Math.max(n.ins.length, n.outs.length, 1);
    var np = n.params ? n.params.length : 0;
    n.w = BOXW;
    n.h = HEADH + PADV*2 + rows * ROWH + (np ? PARAMPAD + np * PARAMH : 0);
  });

  var edges = pairUp(parsed.cables);
  edges.forEach(function(e){
    e.a = nodes[e.from.key]; e.b = nodes[e.to.key];
    e.sig = cableSig(e.cables[0]);   /* may be null, resolved next */
  });
  var guessed = resolveTypes(edges);
  var unknown = 0;
  edges.forEach(function(e){ if (!e.sig){ e.sig = "multi"; e.undetermined = true; unknown++; } });
  view.guessed = guessed; view.unknown = unknown;

  /* Positions. Anything you've placed stays exactly where you put it — the only
     things that move are modules with no position yet, and everything when you
     explicitly ask for a relayout. */
  list.forEach(function(n){ n._feeds = {}; });
  edges.forEach(function(e){ e.a._feeds[e.b.key] = 1; });

  /* If far more modules arrived than were already placed, the patch you
     arranged is not the patch you now have, and threading the new ones in one
     at a time produces a mess. Lay the whole thing out instead. */
  var unplaced = list.filter(function(n){ return !patch.pos[n.key]; }).length;
  var already = list.length - unplaced;
  if (unplaced >= 6 && unplaced > already) pendingLayout = true;

  if (pendingLayout || !Object.keys(patch.pos).length){
    /* No saved positions means a patch that was just loaded or pasted whole, so
       arranging it is welcome rather than intrusive. */
    autoLayout(list, edges);
    pendingLayout = false;
    list.forEach(function(n){ patch.pos[n.key] = { x:n.x, y:n.y }; });
  } else {
    var placed = [];
    list.forEach(function(n){
      var p = patch.pos[n.key];
      if (p){ n.x = p.x; n.y = p.y; placed.push(n); }
    });
    list.forEach(function(n){
      if (patch.pos[n.key]) return;
      var g = placeNew(n, placed);
      n.x = g.x; n.y = g.y;
      patch.pos[n.key] = { x:n.x, y:n.y };
      placed.push(n);
    });
  }

  /* Routing for cables drawn right-to-left. There are two quite different
     reasons a cable does that, and they should not look the same:

       FEEDBACK    the destination is at or before the source in signal order,
                   so it genuinely closes a loop. Routed below everything it
                   passes over, reading as a return path.

       WRAP        the destination is further along in signal order, but the
                   layout wrapped to a new row, so it's drawn to the left. This
                   is a carriage return, not a loop, and belongs in the gutter
                   between the two rows.

     Telling them apart by x position alone is impossible, which is why rank is
     computed on every build rather than only when laying out. */
  rankNodes(list, edges);

  var lanes = [];
  edges.forEach(function(e){
    var x1 = e.a.x + e.a.w, x2 = e.b.x;
    e.self = e.a.key === e.b.key;
    e.back = x2 < x1 + 24;
    e.feedback = e.b._rank <= e.a._rank;
    e.wrap = e.back && !e.feedback;
    /* A module patched into itself gets a tight loop around its own box, not a
       lane. Sending it round the whole diagram to travel 180px is absurd, and
       self-patching is common enough in modular to be worth the special case —
       a self-cycling envelope is an entire genre of patch. */
    if (e.self || !e.back) return;

    var lo = Math.min(x1, x2) - 34, hi = Math.max(x1, x2) + 34;
    /* A wrap only has to clear what's in its own row and above — it's heading
       down to the next row, not back over the whole diagram. But that gutter
       shortcut is only safe while the destination really is lower. Drag the
       boxes so it isn't and the shortcut discards nearly everything in the
       span, computes the lane against nothing, and draws the line high across
       open canvas. When the geometry contradicts the classification, geometry
       wins: route below everything, like any other return. */
    var gutter = e.wrap && e.b.y > e.a.y + e.a.h;
    var boxes = [];
    list.forEach(function(n){
      if (n.x + n.w < lo || n.x > hi) return;
      if (gutter && n.y >= e.b.y) return;
      boxes.push(n);
    });

    /* The lane wants the NEAREST clear corridor, not the bottom of the world.
       Clearing everything in the span meant one box from a lower row anywhere
       along the way dragged the whole return down below it and back up, past
       boxes it was never going to hit. So: start just below the two endpoint
       boxes, and move down only on contact. A wrap still starts in its gutter,
       just above the row it descends into. */
    var y;
    if (gutter){
      var clear = 0;
      boxes.forEach(function(n){ clear = Math.max(clear, n.y + n.h); });
      y = clear + 20;
    } else {
      y = Math.max(e.a.y + e.a.h, e.b.y + e.b.h) + 20;
    }
    /* One loop settles both constraints together: out of any box it lands in,
       and out of any other lane's way. A lane dodge can push into a box and a
       box dodge into a lane, so they have to be checked as one fixpoint. The
       guard is paranoia; each push moves strictly down. */
    var stable = false, guard = 0;
    while (!stable && guard++ < 80){
      stable = true;
      boxes.forEach(function(n){
        if (y > n.y - 12 && y < n.y + n.h + 12){ y = n.y + n.h + 20; stable = false; }
      });
      lanes.forEach(function(L){
        if (Math.abs(L.y - y) < 12 && L.hi >= lo && L.lo <= hi){ y = L.y + 14; stable = false; }
      });
    }
    lanes.push({ lo:lo, hi:hi, y:y });
    e.yb = y;
  });

  var maxx = 0, maxy = 0;
  list.forEach(function(n){ maxx = Math.max(maxx, n.x+n.w); maxy = Math.max(maxy, n.y+n.h); });
  lanes.forEach(function(L){ maxy = Math.max(maxy, L.y + 16); });
  edges.forEach(function(e){ if (e.self) maxy = Math.max(maxy, e.a.y + e.a.h + 30); });
  var w = Math.max(560, maxx + 40);
  /* Footer height is not fixed once notes can be any length, so measure them
     against the width we just settled on and make room. */
  var nNote = (patch.notes || "").trim()
    ? wrapNote(patch.notes, w - 44, NOTE_SIZE).length : 0;

  /* What the section filter fades. A cable belongs to the section its line sat
     under. A module belongs to every section that reaches it, so one shared
     between two stays prominent in both, which is the truth about it. */
  list.forEach(function(n){
    n.dim = !!state.voice && (n.voices || []).indexOf(state.voice) === -1;
  });
  edges.forEach(function(e){
    e.dim = !!state.voice && !e.cables.some(function(c){ return c.voice === state.voice; });
  });

  /* Selection focuses the diagram the same way the section filter does: pick a
     module and everything not patched to it fades, which answers "what is this
     connected to" without reading anything. Union across a multi-selection,
     stacked on top of the voice dim rather than replacing it. */
  if (selCount() && ui.selDim){
    var keep = {};
    for (var sk in sel) keep[sk] = 1;
    edges.forEach(function(e){
      if (sel[e.a.key] || sel[e.b.key]){ keep[e.a.key] = 1; keep[e.b.key] = 1; }
    });
    list.forEach(function(n){ n.dim = n.dim || !keep[n.key]; });
    edges.forEach(function(e){ e.dim = e.dim || !(sel[e.a.key] || sel[e.b.key]); });
  }

  view = { nodes:list, edges:edges, guessed:guessed, unknown:unknown, allCables:allCables,
           w: w,
           h: Math.max(300, maxy + 78) + (nNote ? nNote * NOTE_LEAD + 6 : 0) };
  return view;
}
function addPort(node, jid, side){
  if (node[side].indexOf(jid) === -1) node[side].push(jid);
}

/* ------------------------------------------------------ roles and voices --- */
/*
   Two ways to say what a module is doing in the composition rather than what it
   is. They answer different questions and both are worth having.

     VOICE      which part of the piece.  DRONE:  everything below belongs to it.
     ROLE       what this module is here for.  vco#lead, lfo#drift

   A role is just a named instance, so `vco#lead` and `vco#drone` are two boxes
   the same way `vco#1` and `vco#2` always were. Numeric stays numeric: `vco#2`
   is a second VCO, not a module called 2.
*/
function roleOf(n){
  return (n.inst && !/^\d+$/.test(n.inst)) ? n.inst : null;
}

/* A node's voice comes from its cables, since that's where the voice lives.
   Cables under two different headers means the module is shared, and shared is
   a real answer rather than a tie to break: a mult feeding three voices belongs
   to none of them. */
function assignVoices(list, cables){
  var seen = {};
  cables.forEach(function(c){
    if (!c.voice) return;
    [c.from.key, c.to.key].forEach(function(k){
      (seen[k] = seen[k] || {})[c.voice] = 1;
    });
  });
  list.forEach(function(n){
    var vs = Object.keys(seen[n.key] || {});
    n.voices = vs;
    n.voice  = vs.length === 1 ? vs[0] : null;
    n.shared = vs.length > 1;
  });
}
/* ============================================================== auto layout ===
   Longest-path layering, the first two steps of Sugiyama, and no more than that.

   It is a COMMAND, not a policy. Nothing you have positioned is ever moved by
   it, and it never runs on its own while you type. Your layout always wins.

   1. break cycles     feedback edges are set aside before ranking, otherwise one
                       return cable drags a module backwards and ruins the whole
                       arrangement. This is the step tools skip, and skipping it
                       is why auto-layout has a bad name on patches with feedback.
   2. rank             sources at column 0, everything else one past its deepest
                       input, so signal flows left to right by construction and
                       the order you happened to type in stops mattering.
   3. order            sweep back and forth putting each node at the median of
                       whatever it connects to. This is what removes crossings.
   4. place            stack using real box heights, which the old single row
                       ignored entirely.
   ========================================================================== */

/* Rank every node by longest path from a source, ignoring feedback. Computed on
   every build, not just when laying out, because ROUTING depends on it: a cable
   that runs right-to-left because the layout wrapped is a continuation, whereas
   one that runs right-to-left because it closes a loop is feedback. Judging that
   by x position alone can't tell them apart. */
function rankNodes(nodes, edges){
  var back = backEdges(nodes, edges);
  var fwd = edges.filter(function(e, i){ return !back[i] && e.a.key !== e.b.key; });
  nodes.forEach(function(n){ n._rank = 0; });
  for (var pass = 0; pass < nodes.length; pass++){
    var moved = false;
    fwd.forEach(function(e){
      if (e.b._rank < e.a._rank + 1){ e.b._rank = e.a._rank + 1; moved = true; }
    });
    if (!moved) break;
  }
  return back;
}

/* Depth-first back-edge detection. An edge into a node currently on the stack
   closes a loop, so that edge is the feedback one. */
function backEdges(nodes, edges){
  var adj = {}, state = {}, back = {};
  nodes.forEach(function(n){ adj[n.key] = []; state[n.key] = 0; });
  edges.forEach(function(e, i){
    if (e.a.key !== e.b.key) adj[e.a.key].push({ to:e.b.key, i:i });
  });
  function visit(k){
    state[k] = 1;
    adj[k].forEach(function(x){
      if (state[x.to] === 1) back[x.i] = 1;
      else if (state[x.to] === 0) visit(x.to);
    });
    state[k] = 2;
  }
  nodes.forEach(function(n){ if (!state[n.key]) visit(n.key); });
  return back;
}

/* How many columns before wrapping to a new row. Derived from the pane so the
   result actually fits without scrolling, clamped so rows stay readable. */
/* How tall a single column is allowed to get before it is split. The pane you
   are looking at, so a column fits on screen, with a floor for a short window
   and a ceiling so a tall monitor doesn't produce one endless stack. */
function columnBudget(){
  var pane = document.getElementById("right");
  var h = (pane && pane.clientHeight) || 900;
  return Math.max(700, Math.min(1600, h - 80));
}

function wrapWidth(){
  var pane = document.getElementById("right");
  /* n columns occupy n boxes and n-1 gaps, not n of each: the trailing gap was
     being charged for and cost a column at most window sizes. */
  var avail = (pane ? pane.clientWidth : 1200) - 70 + GAPX;
  var fits = Math.floor(avail / (BOXW + GAPX));
  /* Use the width there is. This used to cap at six columns however wide the
     window, which on a large monitor left a third of the page empty while the
     diagram ran off the bottom. The old floor of four did the opposite on a
     narrow pane, forcing a row wider than the space and guaranteeing a
     horizontal scrollbar. */
  return Math.max(2, fits || 5);
}

function autoLayout(nodes, edges){
  if (!nodes.length) return;
  rankNodes(nodes, edges);

  var cols = [];
  nodes.forEach(function(n){ (cols[n._rank] = cols[n._rank] || []).push(n); });
  cols = cols.filter(Boolean);

  /* Neighbour lists for the ordering sweeps. Feedback edges DO count here —
     they don't affect which column you're in, but a module you feed back into
     should still sit near you vertically. */
  var pred = {}, succ = {};
  nodes.forEach(function(n){ pred[n.key] = []; succ[n.key] = []; });
  edges.forEach(function(e){
    if (e.a.key === e.b.key) return;
    succ[e.a.key].push(e.b.key); pred[e.b.key].push(e.a.key);
  });

  function median(keys, posOf){
    var v = keys.map(function(k){ return posOf[k]; })
      .filter(function(x){ return x != null; }).sort(function(a,b){ return a-b; });
    if (!v.length) return null;
    return v.length % 2 ? v[(v.length-1)/2] : (v[v.length/2 - 1] + v[v.length/2]) / 2;
  }

  var pos = {};
  cols.forEach(function(c){ c.forEach(function(n, i){ pos[n.key] = i; }); });
  for (var sweep = 0; sweep < 4; sweep++){
    var forward = sweep % 2 === 0;
    (forward ? cols : cols.slice().reverse()).forEach(function(c){
      c.forEach(function(n){
        var m = median(forward ? pred[n.key] : succ[n.key], pos);
        n._med = m == null ? pos[n.key] : m;
      });
      c.sort(function(a, b){ return a._med - b._med; });
      c.forEach(function(n, i){ pos[n.key] = i; });
    });
  }

  var perRow = wrapWidth(), GAPY = 26, GUTTER = 66;

  /* Split any column too tall to look at. A rank holding fifty modules — which
     is what you get the moment a patch has a dozen parallel voices, since every
     oscillator and every envelope is a source and shares rank 0 — becomes one
     column five thousand pixels tall. Wrapping columns into rows does nothing
     about that: the row is as tall as its tallest column. No zoom fixes it
     either, because fitting the width barely scales anything while the height
     runs off the screen.

     So a fat column becomes several side-by-side stacks. They are all the same
     rank, so nothing flows between them and splitting costs no legibility: the
     diagram grows across the page instead of down it. */
  var budget = columnBudget();
  var split = [];
  cols.forEach(function(c){
    var total = c.reduce(function(t, n){ return t + n.h + GAPY; }, -GAPY);
    if (c.length < 2 || total <= budget){ split.push(c); return; }
    var parts = Math.ceil(total / budget);
    var per = Math.ceil(c.length / parts);
    for (var k = 0; k < c.length; k += per) split.push(c.slice(k, k + per));
  });
  cols = split;

  /* Wrap into rows, like a paragraph. Each row gets a gutter beneath it wide
     enough for the continuation cable to travel back to the left margin. */
  var rows = [];
  for (var i = 0; i < cols.length; i += perRow) rows.push(cols.slice(i, i + perRow));

  var y0 = 30;
  rows.forEach(function(row, ri){
    var heights = row.map(function(c){
      return c.reduce(function(t, n){ return t + n.h + GAPY; }, -GAPY);
    });
    var tallest = Math.max.apply(null, heights);
    var x = 30;
    row.forEach(function(c, ci){
      var y = y0 + (tallest - heights[ci]) / 2;
      c.forEach(function(n){
        n.x = Math.round(x / 10) * 10;
        n.y = Math.round(Math.max(20, y) / 10) * 10;
        n._row = ri;
        y += n.h + GAPY;
      });
      x += BOXW + GAPX;
    });
    y0 += tallest + GUTTER;
  });
}

/* Placement for a module that has no saved position, in a patch where other
   things already do. Sits it just right of whatever feeds it rather than
   dumping it at the end of the row — and never touches anything positioned. */
function placeNew(n, placed){
  var feeders = placed.filter(function(p){ return p._feeds && p._feeds[n.key]; });
  if (feeders.length){
    var fx = Math.max.apply(null, feeders.map(function(p){ return p.x + p.w; }));
    var fy = feeders.reduce(function(t, p){ return t + p.y; }, 0) / feeders.length;
    return { x: Math.round((fx + GAPX) / 10) * 10, y: Math.round(fy / 10) * 10 };
  }
  if (!placed.length) return { x: 30, y: 40 };

  /* A module with no feeder yet used to go to the right of everything, on one
     line, forever. Adding a couple that way is fine; typing a dozen voices gave
     a canvas twenty thousand pixels wide and three hundred tall, which zoom
     cannot rescue because the floor is reached long before it fits. Wrap into
     rows the same width the layout uses. */
  var limit = 30 + wrapWidth() * (BOXW + GAPX);
  var right = Math.max.apply(null, placed.map(function(p){ return p.x + p.w; }));
  if (right + GAPX + BOXW <= limit)
    return { x: Math.round((right + GAPX) / 10) * 10, y: 40 };

  var bottom = Math.max.apply(null, placed.map(function(p){ return p.y + p.h; }));
  return { x: 30, y: Math.round((bottom + GAPY) / 10) * 10 };
}

function portY(node, side, jid){
  var arr = node[side], i = arr.indexOf(jid);
  return node.y + HEADH + PADV + i*ROWH + ROWH/2;
}
function portX(node, side){ return side === "ins" ? node.x : node.x + node.w; }

/* ----------------------------------------------------------------- rendering --- */

var SVGNS = "http://www.w3.org/2000/svg";
function el(name, attrs, text){
  var e = document.createElementNS(SVGNS, name);
  for (var k in attrs) if (attrs[k] != null) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  return e;
}
/* Everything is set as presentation attributes rather than CSS classes so the
   exported SVG is self-contained and prints exactly as it looks here. */
function render(){
  var v = build();
  var svg = document.getElementById("diagram");
  /* Editing the text can retire a key out from under the selection. */
  selPrune();
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  svg.setAttribute("width", v.w); svg.setAttribute("height", v.h);
  svg.setAttribute("viewBox", "0 0 "+v.w+" "+v.h);
  /* Deliberately NOT setting xmlns here — XMLSerializer emits the namespace
