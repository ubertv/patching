     declaration itself, and setting it as an attribute too produces a duplicate
     that strict XML parsers reject. The export handler adds it only if missing. */
  svg.setAttribute("font-family", "ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif");

  var defs = el("defs");
  SIGORDER.forEach(function(s){
    /* markerUnits=userSpaceOnUse, otherwise the arrowhead scales with stroke
       width and the 5.4px stereo cables sprout arrows the size of the ports.
       refX past the tip pulls it back so the port dot stays visible. */
    var mk = el("marker", { id:"arw-"+s, viewBox:"0 0 10 10", refX:"13", refY:"5",
      markerWidth:"7.5", markerHeight:"7.5", markerUnits:"userSpaceOnUse", orient:"auto" });
    mk.appendChild(el("path", { d:"M 0 0 L 10 5 L 0 10 z", fill:SIG[s].c }));
    defs.appendChild(mk);
  });
  svg.appendChild(defs);
  svg.appendChild(el("rect", { x:0, y:0, width:v.w, height:v.h, fill:TH.sheet }));

  var gCables = el("g"), gBoxes = el("g");
  svg.appendChild(gCables); svg.appendChild(gBoxes);

  /* (bottom/lane bookkeeping now lives in build(), where the canvas height is set) */

  v.edges.forEach(function(e){
    var s = SIG[e.sig];
    /* One group per cable so a single opacity covers the trunk, its white
       casing, the arrowhead and any label. */
    var gc = el("g", { opacity: e.dim ? DIM : null });
    gCables.appendChild(gc);
    /* Every real port this edge touches — two at each end when it's a stereo
       pair. The merged line has to actually land on all of them, otherwise the
       R ports sit there looking unpatched when they aren't. */
    var srcs = e.cables.map(function(c){
      return { x: portX(e.a,"outs"), y: portY(e.a,"outs", c.from.jack) }; });
    var dsts = e.cables.map(function(c){
      return { x: portX(e.b,"ins"),  y: portY(e.b,"ins",  c.to.jack) }; });
    function avgY(a){ return a.reduce(function(t,p){ return t+p.y; }, 0) / a.length; }

    var x1 = srcs[0].x, x2 = dsts[0].x;
    var sy = avgY(srcs), dy = avgY(dsts);
    var back = e.back;
    /* Stereo pulls the trunk back from the box edge to leave room for the fork.
       Feedback edges need it too, otherwise the fork collapses onto the panel
       edge and reads as a vertical bar rather than a join. */
    var fx = e.stereo ? x1 + 18 : x1;
    var gx = e.stereo ? x2 - 18 : x2;

    var d, yb = null;
    if (e.self){
      /* Out of the output, around the nearer edge of the box, back into the
         input. Above unless that would run off the top of the canvas. */
      var n = e.a;
      var over = (Math.min(sy, dy) - n.y) <= ((n.y + n.h) - Math.max(sy, dy));
      if (over && n.y < 40) over = false;
      var yy = over ? n.y - 16 : n.y + n.h + 16;
      d = "M "+x1+" "+sy+" L "+(x1+18)+" "+sy+" L "+(x1+18)+" "+yy+
          " L "+(x2-18)+" "+yy+" L "+(x2-18)+" "+dy+" L "+x2+" "+dy;
    } else if (!back){
      var dx = Math.max(30, (gx - fx) * 0.45);
      d = "M "+fx+" "+sy+" C "+(fx+dx)+" "+sy+", "+(gx-dx)+" "+dy+", "+gx+" "+dy;
    } else {
      /* Orthogonal route: a feedback return below what it passes over, or a
         wrap dropping into the gutter on its way to the next row. Lane assigned
         in build() so the canvas height can account for it. */
      yb = e.yb;
      d = "M "+fx+" "+sy+" L "+(fx+22)+" "+sy+" L "+(fx+22)+" "+yb+
          " L "+(gx-22)+" "+yb+" L "+(gx-22)+" "+dy+" L "+gx+" "+dy;
    }

    if (e.stereo){
      /* Fork out of both source ports into the trunk... */
      srcs.forEach(function(p){
        gc.appendChild(el("path", { d:"M "+p.x+" "+p.y+" L "+fx+" "+sy,
          fill:"none", stroke:s.c, "stroke-width":2.2, "stroke-dasharray":s.d||null }));
      });
      /* ...the trunk as a railroad, a fat stroke with a thin white core... */
      gc.appendChild(el("path", { d:d, fill:"none", stroke:s.c, "stroke-width":5.4,
        "stroke-dasharray":s.d||null, "stroke-linejoin":"round" }));
      gc.appendChild(el("path", { d:d, fill:"none", stroke:TH.knock, "stroke-width":1.8,
        "stroke-linejoin":"round" }));
      /* ...and back out to both destination ports, each with its own arrowhead. */
      dsts.forEach(function(p){
        gc.appendChild(el("path", { d:"M "+gx+" "+dy+" L "+p.x+" "+p.y,
          fill:"none", stroke:s.c, "stroke-width":2.2, "stroke-dasharray":s.d||null,
          "marker-end":"url(#arw-"+e.sig+")" }));
      });
    } else {
      gc.appendChild(el("path", { d:d, fill:"none", stroke:s.c, "stroke-width":2.2,
        "stroke-dasharray":s.d||null, "stroke-linejoin":"round",
        "marker-end":"url(#arw-"+e.sig+")" }));
    }

    var note = e.cables.map(function(c){ return c.note; }).filter(Boolean)[0];
    if (note){
      gc.appendChild(el("text", { x:(fx+gx)/2, y: back ? yb - 5 : (sy+dy)/2 - 6,
        "text-anchor":"middle", "font-size":9.5, fill:TH.ink2, "font-style":"italic" }, note));
    }

    /* Click a cable, land on the line that wrote it. The visible stroke is a
       miserable click target at 2.2px, so an invisible fat twin catches the
       click and carries the line numbers — a stereo pair can come from two
       lines, so it's a span. */
    var lns = e.cables.map(function(c){ return c.line; });
    gc.appendChild(el("path", { d:d, fill:"none", stroke:"#000",
      "stroke-opacity":0, "stroke-width":14, "pointer-events":"stroke",
      cursor:"pointer", "data-lo":Math.min.apply(null,lns),
      "data-hi":Math.max.apply(null,lns) }));
  });

  /* A port's colour should agree with the cable plugged into it. Colouring it
     from the jack's own sig means a `multi` input carrying audio draws a grey
     dot on the end of a red cable, which reads as a contradiction. The jack's
     type is the fallback for ports we somehow didn't route. */
  var portSig = {};
  v.edges.forEach(function(e){
    e.cables.forEach(function(c){
      portSig[c.from.key + "\u0000" + c.from.jack] = e.sig;
      portSig[c.to.key   + "\u0000" + c.to.jack]   = e.sig;
    });
  });

  v.nodes.forEach(function(n){
    var m = byId(n.mod), gen = !!m.generic;
    var g = el("g", { "class":"box" + (sel[n.key] ? " sel" : ""), "data-key":n.key,
                      opacity: n.dim ? DIM : null });
    /* Generic placeholders get the same solid box as anything else — they're
       marked by the italic name and the "generic" subtitle, which is enough to
       tell them apart without making half the diagram look provisional. */
    g.appendChild(el("rect", { x:n.x, y:n.y, width:n.w, height:n.h, rx:5,
      fill:TH.sheet, stroke:TH.rule, "stroke-width":1.4 }));
    /* Title wash by category. Generics take the same tint as the real thing —
       a generic VCO and an Ensemble Oscillator are both sound sources, and
       that's the useful reading. What still separates them is the italic name
       and the "generic" subtitle, which was always the load-bearing signal. */
    /* Rounded at the top only, square where it meets the rule. A plain rx rect
       rounds all four corners and leaves two white notches under the title —
       invisible at the old near-grey, obvious once there's a hue in there. */
    var hx = n.x, hy = n.y, hw = n.w, hr = 5;
    g.appendChild(el("path", { d:
      "M "+hx+" "+(hy+HEADH)+" L "+hx+" "+(hy+hr)+
      " Q "+hx+" "+hy+" "+(hx+hr)+" "+hy+
      " L "+(hx+hw-hr)+" "+hy+
      " Q "+(hx+hw)+" "+hy+" "+(hx+hw)+" "+(hy+hr)+
      " L "+(hx+hw)+" "+(hy+HEADH)+" Z",
      fill: catFill(m) || (gen ? TH.genfill : TH.nofill), stroke:"none" }));
    g.appendChild(el("line", { x1:n.x, y1:n.y+HEADH, x2:n.x+n.w, y2:n.y+HEADH,
      stroke:TH.rule, "stroke-width":1.1 }));
    /* A named instance is a ROLE — vco#lead — and it earns the second line,
       because on a diagram you're reading to remember a patch "lead" is worth
       more than "Instruo". A numeric one is just a second of the same module,
       so it stays in the title where it always was and the maker keeps the line. */
    var role = roleOf(n);
    g.appendChild(el("text", { x:n.x+9, y:n.y+15, "font-size":12, "font-weight":"700",
      "font-style": gen ? "italic" : null, fill: gen ? TH.gen : TH.ink },
      m.name + (role ? "" : (n.inst ? " #"+n.inst : ""))));
    g.appendChild(el("text", { x:n.x+9, y:n.y+25, "font-size":8.5,
      fill: role ? TH.role : TH.ink3,
      "font-weight": role ? "600" : null,
      "font-style": (gen && !role) ? "italic" : null },
      role ? role
           : (gen ? (m.kind ? "generic · "+m.kind : "generic") : (m.mfr || m.libName || ""))));

    n.ins.forEach(function(jid, i){
      var y = n.y + HEADH + PADV + i*ROWH + ROWH/2;
      var j = jack(n.mod, jid);
      var s = SIG[portSig[n.key + "\u0000" + jid] || j.sig] || SIG.multi;
      /* Inputs and outputs draw identically. Ports used to go hollow to mark a
         normal, which is why the asymmetry with the output side below is gone. */
      g.appendChild(el("circle", { cx:n.x, cy:y, r:3.6,
        fill:s.c, stroke:TH.sheet, "stroke-width":1 }));
      g.appendChild(el("text", { x:n.x+9, y:y+3.4, "font-size":10.5, fill:TH.ink },
        j.label));
    });
    n.outs.forEach(function(jid, i){
      var y = n.y + HEADH + PADV + i*ROWH + ROWH/2;
      var j = jack(n.mod, jid);
      var s = SIG[portSig[n.key + "\u0000" + jid] || j.sig] || SIG.multi;
      g.appendChild(el("circle", { cx:n.x+n.w, cy:y, r:3.6, fill:s.c, stroke:TH.sheet, "stroke-width":1 }));
      g.appendChild(el("text", { x:n.x+n.w-9, y:y+3.4, "font-size":10.5, fill:TH.ink,
        "text-anchor":"end" }, j.label));
    });

    /* Knob settings, under a rule at the bottom of the box. A patch you can't
       rebuild from the diagram isn't documented, and cables are only half of it. */
    if (n.params && n.params.length){
      var py = n.y + HEADH + PADV*2 + Math.max(n.ins.length, n.outs.length, 1) * ROWH - PADV;
      g.appendChild(el("line", { x1:n.x+8, y1:py, x2:n.x+n.w-8, y2:py,
        stroke:TH.hair, "stroke-width":1 }));
      n.params.forEach(function(p, i){
        var ty = py + PARAMPAD + i*PARAMH + 4;
        g.appendChild(el("text", { x:n.x+9, y:ty, "font-size":9, fill:TH.ink2 }, p.name));
        g.appendChild(el("text", { x:n.x+n.w-9, y:ty, "font-size":9, fill:TH.ink,
          "text-anchor":"end", "font-weight":"600" }, p.value));
      });
    }
    gBoxes.appendChild(g);
  });

  drawLegend(svg, v);
  drawBand(svg);
  wireDrag(svg);
  applyZoom();   /* render() resets width/height, so restore the zoom */
  report();
  updateStat();
  renderGuide();  /* no-op unless the guide is the visible pane */

  /* The focus controls say what state the diagram is in. "Dim others" shows
     whether clicking will fade; "Show all" only exists while something is
     actually faded, and is the visible way back. */
  var bd = document.getElementById("bdim"), bs = document.getElementById("bshowall");
  if (bd) bd.classList.toggle("on", !!ui.selDim);
  if (bs) bs.style.display = (selCount() && ui.selDim) ? "" : "none";
}

/* SVG text does not wrap. Break the notes into lines that fit the diagram width,
   measuring in the crude but dependable way: an average character advance for the
   font size, which is close enough for a proportional face at this size and needs
   no DOM measurement pass. Long words are left to overhang rather than hyphenated. */
function wrapNote(text, width, size){
  var per = size * 0.52, max = Math.max(20, Math.floor(width / per)), out = [];
  String(text).split(/\n/).forEach(function(para){
    if (!para.trim()){ out.push(""); return; }
    var line = "";
    para.trim().split(/\s+/).forEach(function(w){
      if (!line) { line = w; return; }
      if ((line + " " + w).length <= max) line += " " + w;
      else { out.push(line); line = w; }
    });
    if (line) out.push(line);
  });
  while (out.length && out[out.length-1] === "") out.pop();
  return out;
}
function noteLines(v){
  var t = (patch.notes || "").trim();
  return t ? wrapNote(t, v.w - 44, NOTE_SIZE) : [];
}

function drawLegend(svg, v){
  var used = {};
  v.edges.forEach(function(e){ used[e.sig] = 1; });
  var keys = SIGORDER.filter(function(s){ return used[s]; });
  /* NOTE: no early return when there are no cable types. A patch can have boxes
     and no cables at all (parameters only), and bailing here used to take the
     name and counts line with it. Only the swatches are conditional. */
  /* The footer is a stack, so everything above the notes has to move up by
     exactly as much as the notes take. Anchoring only the name line to the note
     height, as a first attempt did, drops the notes straight through the legend. */
  var nl = noteLines(v);
  var noteH = nl.length ? nl.length * NOTE_LEAD + 6 : 0;
  var y = v.h - 46 - noteH, x = 26;
  if (!keys.length && !nl.length && !v.nodes.length) return;
  svg.appendChild(el("line", { x1:20, y1:y-16, x2:v.w-20, y2:y-16, stroke:TH.hair2, "stroke-width":1 }));
  keys.forEach(function(s){
    svg.appendChild(el("path", { d:"M "+x+" "+y+" L "+(x+34)+" "+y, stroke:SIG[s].c,
      "stroke-width":2.2, "stroke-dasharray":SIG[s].d||null, fill:"none" }));
    svg.appendChild(el("text", { x:x+40, y:y+3.5, "font-size":10, fill:TH.ink2 }, SIG[s].n));
    x += 44 + SIG[s].n.length * 5.6 + 16;
  });
  if (v.edges.some(function(e){ return e.stereo; })){
    svg.appendChild(el("path", { d:"M "+x+" "+y+" L "+(x+34)+" "+y, stroke:TH.gen, "stroke-width":5.4, fill:"none" }));
    svg.appendChild(el("path", { d:"M "+x+" "+y+" L "+(x+34)+" "+y, stroke:TH.knock, "stroke-width":1.8, fill:"none" }));
    svg.appendChild(el("text", { x:x+40, y:y+3.5, "font-size":10, fill:TH.ink2 }, "stereo pair"));
    x += 132;
  }
  var baseY = v.h - 14 - noteH;
  svg.appendChild(el("text", { x:20, y:baseY, "font-size":10, fill:TH.faint },
    (patch.name || "Untitled patch") + " · " + v.nodes.length + " modules · " +
    parsed.cables.length + " cables"));
  nl.forEach(function(t, i){
    if (!t) return;
    svg.appendChild(el("text", { x:20, y:baseY + 16 + i*NOTE_LEAD,
      "font-size":NOTE_SIZE, fill:TH.gen }, t));
  });
}

/* ------------------------------------------------------------------ dragging --- */

/* ------------------------------------------------------- select and drag ---
   Selection lives here rather than in the patch, because it is about what you
   are doing right now, not about the patch itself. It is deliberately not
   saved: reopening a patch should not restore a selection you have forgotten
   making.

   Shift-click adds or removes one. Dragging on empty canvas rubber-bands.
   Dragging a selected box moves the whole selection.
*/
var sel = {};                       /* key -> 1 */
var drag = null, band = null;

function selCount(){ return Object.keys(sel).length; }
function clearSel(){ sel = {}; }
function selPrune(){                /* keys can vanish when the text changes */
  var live = {};
  ((view && view.nodes) || []).forEach(function(n){ if (sel[n.key]) live[n.key] = 1; });
  sel = live;
}

/* The SVG is scaled with CSS width/height, so getBoundingClientRect() is in
   scaled pixels while node coordinates are not. Everything below converts once,
   here. Without it a box travels twice as far as the pointer at 200%. */
function svgPt(svg, ev){
  var r = svg.getBoundingClientRect(), z = ui.zoom || 1;
  return { x: (ev.clientX - r.left) / z, y: (ev.clientY - r.top) / z };
}

/* render() rebuilds the diagram's children but keeps the same <svg>, so this
   has to be idempotent. It wasn't: every render added another mousedown
   listener, and by the time you'd dragged a few boxes a single click was
   running the handler dozens of times. */
/* Select lines lo..hi in the editor and scroll them into view. Native
   selection through setSelectionRange: no overlay to keep in sync, and the
   browser draws it. The 20.6 line height matches caretXY. Returns the range so
   the arithmetic is testable without a DOM. */
function jumpToLine(lo, hi){
  var ta = document.getElementById("src");
  var lines = ta.value.split("\n");
  var start = 0, i;
  for (i = 0; i < lo - 1 && i < lines.length; i++) start += lines[i].length + 1;
  var end = start;
  for (i = lo - 1; i <= hi - 1 && i < lines.length; i++) end += lines[i].length + 1;
  if (end > start) end -= 1;   /* keep the trailing newline out of it */
  /* The last line has no trailing newline, so a line number past the end
     overshoots the buffer by one. */
  start = Math.min(start, ta.value.length);
  end = Math.min(end, ta.value.length);
  var top = Math.max(0, (lo - 1) * 20.6 - 60);
  if (ta.setSelectionRange){ ta.focus(); ta.setSelectionRange(start, end); }
  ta.scrollTop = top;
  return { start:start, end:end, top:top };
}

/* Comment a cable's lines out, or back in. execCommand is deprecated and also
   the only way to edit a textarea that keeps the browser's own undo stack
   alive, which matters here more than anywhere: this is a write triggered from
   the diagram, and Cmd+Z must undo it. The disabled cable vanishes from the
   diagram immediately — comments are stripped before it's built — so the way
   back is undo, the text, or the guide's Not patched list. */
function toggleLines(lo, hi){
  var ta = document.getElementById("src");
  var r = jumpToLine(lo, hi);
  var text = ta.value.slice(r.start, r.end);
  if (!text.trim()) return;
  var lines = text.split("\n");
  var allOff = lines.every(function(L){ return !L.trim() || /^\s*\/\//.test(L); });
  var out = lines.map(function(L){
    if (!L.trim()) return L;
    return allOff ? L.replace(/^(\s*)\/\/\s?/, "$1") : L.replace(/^(\s*)/, "$1// ");
  }).join("\n");
  if (out === text) return;
  if (document.execCommand && document.execCommand("insertText", false, out)) return;
  /* No execCommand means no native undo either way, so setRangeText is not a
     downgrade there. */
  ta.setRangeText(out, r.start, r.end, "end");
  ta.dispatchEvent(new Event("input", { bubbles: true }));
}

/* Where a module first appears in the text: its earliest cable, or failing
   that its parameter block. */
function firstMention(key){
  var best = null;
  parsed.cables.forEach(function(c){
    if (c.from.key === key || c.to.key === key)
      best = best === null ? c.line : Math.min(best, c.line);
  });
  (parsed.params[key] || []).forEach(function(p){
    best = best === null ? p.line : Math.min(best, p.line);
  });
  return best;
}

function wireDrag(svg){
  if (svg.__wired) return;
  svg.__wired = true;
  svg.addEventListener("mousedown", function(ev){
    if (ev.button !== 0) return;
    /* A cable first, before the band logic gets a chance to treat the click as
       empty canvas and clear the selection. */
    var hp = ev.target.closest ? ev.target.closest("[data-lo]") : null;
    if (hp){
      ev.preventDefault();
      /* Alt-click disables the cable, plain click jumps to it. */
      if (ev.altKey) toggleLines(+hp.getAttribute("data-lo"), +hp.getAttribute("data-hi"));
      else jumpToLine(+hp.getAttribute("data-lo"), +hp.getAttribute("data-hi"));
      return;
    }
    var g = ev.target.closest ? ev.target.closest(".box") : null;
    var p = svgPt(svg, ev);

    /* Empty canvas: start a rubber band. Plain drag replaces the selection,
       shift-drag adds to it. */
    if (!g){
      ev.preventDefault();
      if (!ev.shiftKey && selCount()){ clearSel(); render(); }
      band = { svg:svg, x0:p.x, y0:p.y, x1:p.x, y1:p.y, add:{} };
      for (var k in sel) band.add[k] = 1;
      document.addEventListener("mousemove", onBand);
      document.addEventListener("mouseup", endBand);
      return;
    }

    ev.preventDefault();
    var key = g.getAttribute("data-key");
    var n = view.nodes.filter(function(x){ return x.key === key; })[0];
    if (!n) return;

    if (ev.shiftKey){
      /* Toggle, and do not start a drag. Picking members should not nudge them. */
      if (sel[key]) delete sel[key]; else sel[key] = 1;
      render();
      return;
    }
    /* Dragging an unselected box selects just it, so a plain drag behaves the
       way it always did. Dragging one that is already selected keeps the set.
       Whether it was already selected decides what a no-move click means at
       endDrag: focus, or unfocus. */
    var wasSel = !!sel[key];
    if (!sel[key]){ clearSel(); sel[key] = 1; }

    var keys = Object.keys(sel), from = {};
    keys.forEach(function(k){
      var m = view.nodes.filter(function(x){ return x.key === k; })[0];
      if (m) from[k] = { x:m.x, y:m.y };
    });
    var minx = Infinity, miny = Infinity;
    keys.forEach(function(k){
      if (!from[k]) return;
      minx = Math.min(minx, from[k].x); miny = Math.min(miny, from[k].y);
    });
    drag = { svg:svg, px:p.x, py:p.y, from:from, minx:minx, miny:miny, moved:false,
             key:key, wasSel:wasSel };
    g.classList.add("dragging");
    document.addEventListener("mousemove", onDrag);
    document.addEventListener("mouseup", endDrag);
    render();
  });
}

function onDrag(ev){
  if (!drag) return;
  var p = svgPt(drag.svg, ev);
  /* One delta, snapped once, applied to every member. Snapping each box on its
     own would shear the group apart as they cross grid lines at different
     moments. */
  var dx = Math.round((p.x - drag.px) / 10) * 10;
  var dy = Math.round((p.y - drag.py) / 10) * 10;
  /* Clamp the delta, not each box. Clamping individually lets the leading edge
     of the group stop at the margin while the rest keeps coming, and the
     arrangement you built is quietly flattened into a pile. */
  dx = Math.max(dx, 10 - drag.minx);
  dy = Math.max(dy, 10 - drag.miny);
  if (dx || dy) drag.moved = true;
  Object.keys(drag.from).forEach(function(k){
    patch.pos[k] = { x: drag.from[k].x + dx, y: drag.from[k].y + dy };
  });
  render();
}
function endDrag(){
  document.removeEventListener("mousemove", onDrag);
  document.removeEventListener("mouseup", endDrag);
  /* A click that never moved anything is a click, and it toggles. First click
     picks the box, which fades everything not patched to it and lands the
     editor on its first mention. Clicking a box that was already picked clears
     the selection, so the way back is the same gesture that got you in, not
     just Esc or empty canvas. A drag does none of this. */
  var wasClick = drag && !drag.moved && drag.key;
  var wasSel = drag && drag.wasSel;
  drag = null; save();
  if (wasClick && wasSel) clearSel();
  render();
  if (wasClick && !wasSel){
    var ln = firstMention(wasClick);
    if (ln !== null) jumpToLine(ln, ln);
  }
}

function onBand(ev){
  if (!band) return;
  var p = svgPt(band.svg, ev);
  band.x1 = p.x; band.y1 = p.y;
  var lo = { x: Math.min(band.x0, band.x1), y: Math.min(band.y0, band.y1) };
  var hi = { x: Math.max(band.x0, band.x1), y: Math.max(band.y0, band.y1) };
  sel = {};
  for (var k in band.add) sel[k] = 1;
  /* Touch, not enclose. Requiring a box to be fully surrounded means missing
     the one you were obviously reaching for. */
  view.nodes.forEach(function(n){
    if (n.x < hi.x && n.x + n.w > lo.x && n.y < hi.y && n.y + n.h > lo.y) sel[n.key] = 1;
  });
  render();
}
function endBand(){
  document.removeEventListener("mousemove", onBand);
  document.removeEventListener("mouseup", endBand);
  band = null; render();
}
function drawBand(svg){
  if (!band) return;
  svg.appendChild(el("rect", { id:"band",
    x: Math.min(band.x0, band.x1), y: Math.min(band.y0, band.y1),
    width:  Math.abs(band.x1 - band.x0),
    height: Math.abs(band.y1 - band.y0) }));
}

/* ------------------------------------------------------------------ warnings --- */

function report(){
  var out = [];
  parsed.errors.forEach(function(e){
    out.push({ lvl:"err", ln:e.line, html:e.msg });
  });

  parsed.cables.forEach(function(c){
    var a = jack(c.from.mod, c.from.jack), b = jack(c.to.mod, c.to.jack);
    /* Direction. `both` jacks (passive mults) legitimately go either way. */
    if (a.dir === "in")
      out.push({ lvl:"err", ln:c.line, html:"<b>"+esc(a.label)+"</b> on "+esc(c.from.mod)+
        " is an input, so it can't be the source of a cable." });
    if (b.dir === "out")
      out.push({ lvl:"err", ln:c.line, html:"<b>"+esc(b.label)+"</b> on "+esc(c.to.mod)+
        " is an output, so it can't be the destination." });
    /* NO TYPE-MISMATCH WARNING. A clock into a gate input, an LFO into V/OCT,
       audio into a CV input — all ordinary patching. The source decides the
       cable's type and that's the end of it. */
  });

  /* You cannot physically plug two cables into one input. PatchBook's data model
     enforces this by overwriting, silently — better to say so. If you meant to
     feed two things there you want a mult, or a stackable, and the diagram
     should show that rather than pretend. */
  var inUse = {};
  (view.allCables || parsed.cables).forEach(function(c){
    var k = c.to.key + ":" + c.to.jack;
    (inUse[k] = inUse[k] || []).push(c);
  });
  Object.keys(inUse).forEach(function(k){
    var cs = inUse[k];
    if (cs.length < 2) return;
    var j = jack(cs[0].to.mod, cs[0].to.jack);
    out.push({ lvl:"err", ln:cs[0].line, html:"<b>"+cs.length+" cables into one input.</b> "+
      esc(cs[0].to.key)+" <span class='mono'>"+esc(cs[0].to.jack)+"</span>"+
      (j ? " ("+esc(j.label)+")" : "")+" is fed from lines "+
      cs.map(function(c){ return c.line; }).join(", ")+
      ". Only one cable fits. Patch a mult in, or use a stackable." });
  });

  /* NO NORMALLING NOTICE. The `normalled` prose is still collected and still
     shown in modules.html, but the patch page says nothing about it. Telling you
     which normal you're breaking is only worth trusting across a library that
     covers your rack, and 18 real modules isn't that. A notice that fires on the
     few modules we happen to hold reads as coverage we don't have. Bring it back
     when the library does. */

  /* One summary line each, not one per cable — this is the difference between a
     useful nudge and a wall you learn to ignore. */
  if (view.unknown)
    out.push({ lvl:"warn", ln:0, html:"<b>"+view.unknown+"</b> cable"+(view.unknown===1?"":"s")+
      " draw grey: both ends are type-agnostic jacks and nothing upstream settles it. "+
      "Add a <span class='mono'>[type]</span> tag if you want them coloured." });
  if (view.guessed)
    out.push({ lvl:"ok", ln:0, html:"<b>"+view.guessed+"</b> cable"+(view.guessed===1?"":"s")+
      " coloured by following the signal through a type-agnostic module, rather than from the jacks themselves." });

  var host = document.getElementById("msgs");
  if (!out.length){
    host.innerHTML = parsed.cables.length
      ? '<div class="msg ok">Nothing to flag.</div>' : "";
    return;
  }
  var order = { err:0, warn:1, ok:2 };
  out.sort(function(x,y){ return order[x.lvl]-order[y.lvl] || x.ln-y.ln; });
  host.innerHTML = out.map(function(o){
    /* A message with a line number is a way back to the line. One without is
       about the whole patch, so it stays inert rather than pretending. */
    return '<div class="msg '+(o.lvl==="err"?"err":o.lvl==="warn"?"warn":"ok")+
      (o.ln ? ' goto" data-ln="'+o.ln+'"' : '"')+'>'+
      '<span class="ln">'+(o.ln || "")+'</span>'+o.html+'</div>';
  }).join("");
}

/* Click a message, land on the line it is about. The line number was always
   printed and you always had to go and find it yourself. */
document.getElementById("msgs").addEventListener("click", function(ev){
  var row = ev.target.closest && ev.target.closest(".msg.goto");
  if (!row) return;
  var ln = parseInt(row.getAttribute("data-ln"), 10);
  if (!ln) return;
  var ta = document.getElementById("src"), lines = ta.value.split("\n");
  if (ln > lines.length) return;
  var from = 0;
  for (var i = 0; i < ln - 1; i++) from += lines[i].length + 1;
  ta.focus();
  ta.setSelectionRange(from, from + lines[ln-1].length);
  /* Textareas do not scroll to a selection on their own. Approximate the line
     height from the computed style and put the line a third of the way down. */
  var lh = parseFloat(getComputedStyle(ta).lineHeight) || 18;
  ta.scrollTop = Math.max(0, (ln - 1) * lh - ta.clientHeight / 3);
});
function paintVoices(){
  var sel = document.getElementById("vfilter");
  var vs = parsed.voices || [];
  if (!vs.length){ sel.style.display = "none"; state.voice = ""; return; }
  sel.style.display = "";
  if (state.voice && vs.indexOf(state.voice) === -1) state.voice = "";
  sel.innerHTML = '<option value="">All sections</option>' + vs.map(function(v){
    return '<option value="'+esc(v)+'"'+(v===state.voice?" selected":"")+'>'+esc(v)+'</option>';
  }).join("");
}
document.getElementById("vfilter").addEventListener("change", function(){
  state.voice = this.value; render();
});

function updateStat(){
  var e = parsed.errors.length + document.querySelectorAll("#msgs .msg.err").length;
  document.getElementById("stat").innerHTML =
    view.nodes.length + " modules · " + parsed.cables.length + " cables" +
    (selCount() > 1 ? " · " + selCount() + " selected" : "") +
    (e ? ' · <span style="color:var(--bad)">'+e+' problems</span>' : "") +
    /* Said out loud rather than discovered when the tab closes. modules.html
       has carried this warning since it was written; the patch tool never did,
       which was the worse omission of the two. */
    (STORAGE_OK ? "" : ' · <span style="color:var(--bad)" title="Firefox refuses '+
      'local storage on file:// pages. File → Export all patches keeps your work. '+
      'Serving the folder over http://localhost avoids the problem entirely.">not saving — export to keep</span>');
}

/* -------------------------------------------------------------- autocomplete --- */

var ac = { open:false, items:[], sel:0, from:0, to:0 };
function acHide(){ ac.open = false; document.getElementById("ac").style.display = "none"; }
function acShow(){
  var ta = document.getElementById("src");
  var caret = ta.selectionStart;
  var before = ta.value.slice(0, caret);
  var mj = before.match(/([a-z0-9\-]+)(?:#[a-z0-9\-]+)?:([a-z0-9\-]*)$/i);
  var items = [], from = caret;
  if (mj && byId(mj[1])){
    var js = jacksFor(mj[1]) || [];
    var q = mj[2].toLowerCase();
    items = js.filter(function(j){ return j.id.indexOf(q) === 0 || j.label.toLowerCase().indexOf(q) === 0; })
      .map(function(j){ return { ins:j.id, lab:j.id, hint:j.label+" · "+j.dir+" · "+j.sig }; });
    from = caret - mj[2].length;
  } else {
    var mm = before.match(/([a-z0-9\-]*)$/i);
    var q2 = (mm ? mm[1] : "").toLowerCase();
    if (!q2) { acHide(); return; }
    /* Generics sort after real modules — you own the real ones, they should come
       first when both match what you've typed. */
    items = allModules()
      .filter(function(m){ return m.id.indexOf(q2) === 0 || m.name.toLowerCase().indexOf(q2) === 0; })
      .filter(function(m){ return jacksFor(m.id) && !noJacks(m.id); })
      .filter(function(m){ return !HIDDEN[m.id]; })
      .sort(function(a,b){ return (a.generic?1:0) - (b.generic?1:0); })
      .map(function(m){ return { ins:m.id+":", lab:m.id,
        hint: m.libName ? m.libName+" · "+m.name : m.name }; });
    from = caret - q2.length;
  }
  if (!items.length){ acHide(); return; }
  ac.open = true; ac.items = items.slice(0,40); ac.sel = 0; ac.from = from; ac.to = caret;
  var box = document.getElementById("ac");
  box.innerHTML = ac.items.map(function(it,i){
    return '<div class="'+(i===0?"sel":"")+'" data-i="'+i+'">'+esc(it.lab)+'<small>'+esc(it.hint)+'</small></div>';
  }).join("");
  var co = caretXY(ta);
  box.style.display = "block";
  box.style.left = Math.min(co.x, 210) + "px";
  box.style.top  = (co.y + 18) + "px";
}
function acAccept(){
  if (!ac.open) return false;
  var ta = document.getElementById("src"), it = ac.items[ac.sel];
  ta.value = ta.value.slice(0, ac.from) + it.ins + ta.value.slice(ac.to);
  var c = ac.from + it.ins.length;
  ta.selectionStart = ta.selectionEnd = c;
  acHide(); onEdit();
  if (it.ins.slice(-1) === ":") setTimeout(acShow, 0);
  return true;
}
/* Rough caret position — good enough to put the popup near where you're typing. */
function caretXY(ta){
  var before = ta.value.slice(0, ta.selectionStart);
  var lines = before.split("\n");
  return { x: 12 + (lines[lines.length-1].length * 7.1),
           y: 8 + (lines.length-1) * 20.6 - ta.scrollTop };
}

function esc(s){

/* A patch backed by patches/patches.js is marked, and marked differently once
   it carries an edit, because those two states have different consequences:
   one can be deleted from the file, the other can be reverted to it. */
function paintList(){
  var sel = document.getElementById("plist");
  sel.innerHTML = patchIds().map(function(k){
    var p = getPatch(k), tag = isEdited(k) ? " ·edited" : (fromFile(k) ? " ·file" : "");
    return '<option value="'+esc(k)+'"'+(k===patch.id?" selected":"")+'>'+
      esc(p.name || "Untitled patch")+esc(tag)+'</option>';
  }).join("");

  /* The badge is the visible half of this and the menu item is the actionable
     half. Showing one without the other is how a feature goes unnoticed. */
  var badge = document.getElementById("pstate");
  badge.className = isEdited(patch.id) ? "edited" : (fromFile(patch.id) ? "file" : "");
  badge.textContent = isEdited(patch.id) ? "edited" : (fromFile(patch.id) ? "file" : "");
  badge.title = isEdited(patch.id)
    ? "Changed from the copy in patches/patches.js. File → Revert to file puts it back."
    : (fromFile(patch.id) ? "Exactly as it is in patches/patches.js." : "");

  /* Revert is hidden rather than disabled when it doesn't apply. A greyed item
     for a state you can't be in is noise, and the badge above already says
     which state you are in. Delete is different: it's always a thing you might
     want, so it stays and explains why it's refused. */
  var rev = document.getElementById("brevert"), del = document.getElementById("bdel");
  rev.style.display = isEdited(patch.id) ? "" : "none";
  del.disabled = fromFile(patch.id);

    ? "This patch comes from patches/patches.js. Remove it there."
    : "";
}

/* ------------------------------------------------------- export and import --- */
/*
   Two export shapes, doing two different jobs, and it's worth being clear which
   is which because they look similar.

     patches.js   ALL your patches, in the app's own shape, meant to be dropped
                  back into patches/ and read at boot. This is the durable copy.
     patch JSON   ONE patch, plus a derived `cables` array for other tools to
                  read. This is for sending someone a patch.

   Both carry the id, so both can be imported without duplicating. Neither
   carries the derived diagram, because `src` is the source of truth and
   anything else would be a second copy to drift.
*/
function patchOut(p){
  var o = { id: p.id, name: p.name || "Untitled patch", src: p.src || "" };
  if (p.notes) o.notes = p.notes;
  if (p.pos && Object.keys(p.pos).length) o.pos = p.pos;
  return o;
}
/* The export carries the date it was written.

   That is for one failure that only happens once the app is hosted: a browser
   or a CDN caches patches/patches.js, you upload a new one, and the page keeps
   loading the old copy. Work appears to have vanished, and nothing on screen
   can tell you why. A visible date turns that into an obvious answer. */
/* When the loaded patches/patches.js was written, if it says. */
function fileStamp(){
  var f = (window.PATCH_FILES || [])[0];
  return f && f.exported ? f.exported : null;
}

function exportSource(){
  var list = allPatches().map(patchOut);
  return [
    "// Your patches, written by Patching.",
    "// Drop this in as patches/patches.js. index.html reads it automatically.",
    "//",
    "// Anything you then change in the app is kept in browser storage and",
    "// overrides what's here, matched by id. File → Revert to file throws the",
    "// change away and brings this copy back. Nothing here is ever written by",
    "// the app, so it stays the reference copy.",
    "",
    "window.PATCH_FILES = window.PATCH_FILES || [];",
    "window.PATCH_FILES.push({",
    ' id: "patches",',
    ' name: "My patches",',
    ' exported: "' + new Date().toISOString().slice(0,16).replace("T", " ") + '",',
    " patches: " + JSON.stringify(list, null, 1),
    "});",
    ""
  ].join("\n");
}

/* ONE import command, because "bring this in" is one intention. Which format
   the file happens to be is our problem, not something the user should have to
   answer before they can pick a file — and it's a question they often can't
   answer anyway about a file someone sent them.

   This replaces three separate routes: a picker in the export sheet, a picker
   in the PatchBook sheet, and the menu item. The first two were inherited from
   modules.html, where the sheet genuinely is the only way in. Here it wasn't,
   and one of them sat under Share, which is supposed to be outbound only. */
function sniff(txt, name){
  var n = String(name || "").toLowerCase();
  if (/^\s*[\[{]/.test(txt)) return "json";
  if (/window\.PATCH_FILES|patches:\s*\[/.test(txt)) return "js";
  if (/\.txt$/.test(n)) return "patchbook";
  /* Their markup is lines of connections, ours is too. Either way fromPatchBook
     reads it, since our own syntax is a superset. */
  return "patchbook";
}
function readImport(f){
  if (!f) return;
  var r = new FileReader();
  r.onload = function(){
    var kind = sniff(r.result, f.name);
    if (kind === "patchbook") return importPatchBook(r.result, f.name);
    var list;
    try { list = parseImport(r.result); }
    catch(e){ msg("err", "That didn't parse as a patch file: " + e.message); closeSheet(); return; }
    if (!list.length){ msg("warn", "No patches in that file."); closeSheet(); return; }
    offerImport(list, f.name);
  };
  r.readAsText(f);
}

/* PatchBook comes in as one patch and always as a new one: their format has no
   id, so there's nothing to match on and nothing that could collide. */
function importPatchBook(txt, fname){
  var res = fromPatchBook(txt);
  doImport([{ id:null, name:(fname || "Imported").replace(/\.txt$/i, ""),
              src:res.src, notes:"", pos:{} }], "copy");
  var q = res.report, notes = [];
  function uniq(a){ var s={},o=[]; a.forEach(function(x){ if(!s[x]){s[x]=1;o.push(x);} }); return o; }
  if (q.unmatched.length) notes.push('<div class="msg warn"><b>'+uniq(q.unmatched).length+
    ' module name'+(uniq(q.unmatched).length===1?'':'s')+' not in your rack:</b> '+esc(uniq(q.unmatched).join(", "))+
    '. Those lines are commented out. Swap in a generic such as <span class="mono">vco</span> or <span class="mono">vcf</span>.</div>');
  if (q.unmatchedJacks.length) notes.push('<div class="msg warn"><b>'+uniq(q.unmatchedJacks).length+
    ' jack label'+(uniq(q.unmatchedJacks).length===1?'':'s')+' didn\'t resolve:</b> '+esc(uniq(q.unmatchedJacks).slice(0,8).join(", "))+'</div>');
  if (q.ambiguous.length) notes.push('<div class="msg warn"><b>Ambiguous labels:</b> '+esc(uniq(q.ambiguous).join("; "))+'</div>');
  if (q.triggers) notes.push('<div class="msg warn"><b>'+q.triggers+' trigger connection'+
    (q.triggers===1?'':'s')+'</b> came in as <span class="mono">gate</span>, since we don\'t split the two.</div>');
  if (notes.length) document.getElementById("msgs").innerHTML = notes.join("") +
    document.getElementById("msgs").innerHTML;
  flash("Imported "+q.lines+" connections.");
}
function parseImport(txt){
  var j = null;
  if (/^\s*[\[{]/.test(txt)) j = JSON.parse(txt);
  else {
    var m = txt.match(/patches:\s*(\[[\s\S]*?\])\s*\n\}\);/);
    if (!m) throw new Error("no patches found");
    j = JSON.parse(m[1]);
  }
  var arr = Array.isArray(j) ? j : (j.patches || [j]);
  return arr.filter(function(p){ return p && (p.src || p.cables); }).map(function(p){
    return {
      id: p.id || null,
      name: p.name || "Imported patch",
      notes: p.notes || "",
      pos: p.pos || {},
      /* Cables-only files, which is what other tools would produce, are turned
         back into source. src wins where both are present. */
      src: p.src || (p.cables||[]).map(function(c){
        return c.from + " -> " + c.to + (c.sig ? " ["+c.sig+"]" : "") + (c.note ? ' "'+c.note+'"' : "");
      }).join("\n")
    };
  });
}

/* An id that already exists is genuinely ambiguous: it's your own export coming
   home, or it's someone else's patch that happens to collide. Guessing either
   way loses work, so it asks once for the whole file rather than once per
   patch. */
function offerImport(list, fname){
  var clash = list.filter(function(p){ return p.id && (store.patches[p.id] || FILEP[p.id]); });
  if (!clash.length) return doImport(list, "copy");

  var names = clash.slice(0, 6).map(function(p){
    return "<li>" + esc(getPatch(p.id).name || "Untitled") + "</li>";
  }).join("");
  openSheet(
    '<h3>Already here</h3>'+
    '<div style="color:var(--dim);margin-bottom:10px">'+
      esc(fname || "That file")+' has '+list.length+' patch'+(list.length===1?'':'es')+', and '+
      clash.length+' of them '+(clash.length===1?'has':'have')+' the same id as '+
      (clash.length===1?'a patch':'patches')+' you already have.<br><br>'+
      '<b>Update</b> if this is your own export coming back. <b>Add copies</b> if it came from '+
      'someone else and you want to keep both.'+
      '<ul style="margin:8px 0 0 18px">'+names+
      (clash.length > 6 ? '<li>and '+(clash.length-6)+' more</li>' : '')+'</ul>'+
    '</div>'+
    '<div class="row">'+
      '<button id="impupd" class="primary">Update '+clash.length+'</button>'+
      '<button id="impcopy">Add as copies</button>'+
      '<button id="impskip">Skip '+(clash.length===1?'it':'them')+'</button>'+
    '</div>'
  );
  document.getElementById("impupd").onclick  = function(){ doImport(list, "update"); };
  document.getElementById("impcopy").onclick = function(){ doImport(list, "copy"); };
  document.getElementById("impskip").onclick = function(){ doImport(list, "skip"); };
}

function doImport(list, mode){
  save();
  var added = 0, updated = 0, skipped = 0, last = null;
  list.forEach(function(p){
    var exists = p.id && (store.patches[p.id] || FILEP[p.id]);
    if (exists && mode === "skip"){ skipped++; return; }
    var np = (exists && mode === "update") ? clonePatch(p) : (function(){
      var c = clonePatch(p); c.id = newPatch().id;
      if (exists) c.name = uniquePatchName(p.name || "Imported patch");
      return c;
    })();
    store.patches[np.id] = np;
    if (exists && mode === "update") updated++; else added++;
    last = np;
  });
  if (last) showPatch(last);
  save(); closeSheet(); paintList(); render(); setTimeout(fitWidth, 0);
  var bits = [];
  if (added)   bits.push(added + " added");
  if (updated) bits.push(updated + " updated");
  if (skipped) bits.push(skipped + " skipped");
  flash(bits.join(", ") + ".");
}

    '<div style="color:var(--dim)">A line can carry more than one cable, so a path reads as a '+
      'sentence rather than a list.</div>'+
    '<pre class="mono" style="color:var(--dim);font-size:11.5px">'+
      'vco:saw -&gt; vcf:in -&gt; vca:in -&gt; out:in-l\n'+
      'env:out &gt;&gt; vca:cv and vcf:cutoff</pre>'+
    '<div style="color:var(--dim)">The first is three cables. A module in the middle is written '+
      'once but does two jobs: destination of the cable before it, source of the one after. Those '+
      'are <b>different jacks</b>. It leaves by its output, not the input you named. Each step '+
      'keeps its own arrow, so the type can change along the way: '+
      '<span class="mono">seq:cv p&gt; vcf:cutoff -&gt; vca</span>.<br><br>'+
      'A middle module can name <b>both</b> its jacks, <span class="mono">module:in:out</span>. '+
      'That is what makes a chain usable on anything with more than one output, like a delay with dry '+
      'and wet, a filter with LP, BP and HP:<br><br>'+
      '<span class="mono">vco:saw -&gt; vcf:in:bp -&gt; delay:in:wet -&gt; vca -&gt; out</span><br><br>'+
      'Without it, those modules could only ever sit at the end of a line. It means nothing at the '+
      'start or the end, where an endpoint only has one job, so it is an error there rather than '+
      'being silently dropped.<br><br>'+
      'You can drop a jack entirely when the module has an obvious one: a jack actually called '+
      '<span class="mono">out</span> or <span class="mono">in</span>, or only one facing that way. '+
      'Where there is no obvious answer it asks, and lists the candidates.<br><br>'+
      '<span class="mono">and</span> only works on the last step. '+
      '<span class="mono">a -&gt; b and c -&gt; d</span> reads two ways and neither is obviously '+
      'right, so it errors instead of picking one.</div>'+
    '<h3 style="margin-top:16px">Moving modules</h3>'+
    '<div class="keys" style="grid-template-columns:auto 1fr">'+
      '<div>Drag a module</div><div>moves it. Snaps to a 10px grid.</div>'+
      '<div>Shift-click</div><div>adds a module to the selection, or takes it out.</div>'+
      '<div>Drag on empty canvas</div><div>rubber-band. Anything the box touches is selected. Hold shift to add to what is already picked.</div>'+
      '<div>Drag a selected module</div><div>moves the whole selection together.</div>'+
      '<div>Esc</div><div>deselect.</div>'+
    '</div>'+
    '<div style="color:var(--dim);margin-top:8px;max-width:62ch">Positions are part of the patch and '+
      'save as you go. There is no undo, so <b>Auto layout</b> is the way back.</div>'+
    '<h3 style="margin-top:16px">Notes</h3>'+
    '<div style="color:var(--dim)">The <b>Notes</b> box under the editor is for prose about the '+
      'patch. It prints in the footer under the cable key. What it is for, how it behaves, what '+
      'to try next time.<br><br>'+
      'Notes belong to the patch, so they go with the JSON export and the SVG. '+
      '<b>Comments are a different thing and stay private.</b> Anything after '+
      '<span class="mono">#</span> or <span class="mono">//</span> is stripped before the diagram '+
      'is built, which is what makes a comment safe to scribble in.</div>'+
    '<h3 style="margin-top:16px">Parameters</h3>'+
    '<div style="color:var(--dim)">Knob settings, drawn inside the module box. Cables are only '+
      'half a patch. If you can\'t rebuild it from the diagram, it isn\'t documented. Single line '+
      'or block, both fine. A block is the <span class="mono">*</span> line plus the '+
      '<span class="mono">|</span> lines directly under it: a blank line ends it, a comment '+
      'doesn\'t.</div>'+
    '<pre class="mono" style="color:var(--dim);font-size:11.5px">* vcf: cutoff = 40% | resonance = 3 o\'clock\n\n* delay:\n  | time = 3:8\n  | feedback = 45%\n  | mix = 30%</pre>'+
    '<div style="color:var(--dim)">A module with parameters and no cables still gets a box, so '+
      'you can record settings for something that isn\'t patched into anything. '+
      '<span class="mono">* vcf:</span> on its own puts the module on the page and says nothing '+
      'about it, for when you want to look at something before deciding what it connects to.</div>'
  );
});

/* On the bar as the primary button, and repeated in the Share menu, because
   the button is the shortcut and the menu is where you look when you don't
   already know the shortcut exists. Standard, and it costs one line. */
/* Always light. A diagram is going to a printer or a forum post, and neither
   wants white-on-dark. Render light, serialise, put the interface back. */
function lightSVG(){
  var was = THEME;
  if (was !== "light"){ applyTheme("light"); render(); }
  var svg = document.getElementById("diagram");
  var s = new XMLSerializer().serializeToString(svg);
  if (s.indexOf("xmlns=") === -1) s = s.replace("<svg", '<svg xmlns="'+SVGNS+'"');
  var box = { w: +svg.getAttribute("width"), h: +svg.getAttribute("height") };
  if (was !== "light"){ applyTheme(was); render(); }
  return { src: s, w: box.w, h: box.h };
}

function exportSVG(){
  var g = lightSVG();
  download((slug(patch.name)||"patch")+".svg", '<?xml version="1.0" encoding="UTF-8"?>\n'+g.src);
}

/* PNG, because SVG is useless almost everywhere a diagram actually goes. Most
   forums reject it and no social platform will render it.

   Drawn at 2x so it stays sharp on a retina screen and survives being scaled
   down by a forum. The SVG goes in as a data URL rather than a blob URL: a blob
   is a different origin as far as the canvas is concerned, which taints it and
   makes toBlob throw. Everything is inline and there are no external images, so
   there is nothing else to wait for. */
var PNG_SCALE = 2;
function exportPNG(){
  var g = lightSVG();
  var img = new Image();
  img.onload = function(){
    var c = document.createElement("canvas");
    c.width  = Math.round(g.w * PNG_SCALE);
    c.height = Math.round(g.h * PNG_SCALE);
    var ctx = c.getContext("2d");
    ctx.fillStyle = "#ffffff";                 /* PNG alpha would go black on dark forums */
    ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(img, 0, 0, c.width, c.height);
    c.toBlob(function(blob){
      if (!blob) return msg("err", "Couldn't make a PNG. Export SVG instead.");
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = (slug(patch.name)||"patch")+".png";
      a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
    }, "image/png");
  };
  img.onerror = function(){ msg("err", "Couldn't render the diagram to PNG. Export SVG instead."); };
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(g.src);
}
document.getElementById("btheme").addEventListener("click", function(){
  applyTheme(THEME === "dark" ? "light" : "dark");
  try { localStorage.setItem(LS_THEME, THEME); } catch(e){}
  render();   /* the diagram is drawn in JS, so CSS alone cannot restyle it */
});

document.getElementById("bsvg").addEventListener("click", exportSVG);
document.getElementById("bsvgm").addEventListener("click", exportSVG);
document.getElementById("bpng").addEventListener("click", exportPNG);
/* ---------------------------------------------------------------- PatchBook --- */
/*
   Interop with the Spektro Audio PatchBook markup, which uses free-text
   `Module (Port Label)` rather than validated ids. Converting in either direction
   is close to lossless: five of our six signal types map exactly onto their
   arrows. The two gaps, both flagged when they happen:

     ours `multi`   -> no PatchBook arrow. Exports as `>>` (their default) and the
                      real type is lost.
     their `t>`     -> our `gate`. We never split trigger from gate.

   Their `->` means audio; ours is neutral. The importer therefore writes an
   explicit [audio] tag rather than assuming our `->` means the same thing.
*/
var PB_ARROW = { audio:"->", cv:">>", pitch:"p>", gate:"g>", clock:"c>", multi:">>" };

/* ------------------------------------------------------------------ guide --- */

/* Patch source is written to be typed. A guide is read with your hands full, at
   the rack, rebuilding something you made a month ago. The gap between them is
   almost entirely names: `vcf#lead:in` is a handle, "Ikarie (lead) · L IN" is
   what's printed on the panel. So this expands, it does not prosify. "Take a
   patch cable and connect the SAW output of the oscillator to the input of the
   filter" is longer, slower to scan and no clearer than two names and an arrow.

   Order is the source's own. Sections appear in the order they first appear, and
   cables inside one stay exactly as written, because chain syntax already reads
   in signal order and reshuffling it would lose the author's intent for no gain.
   The only thing that moves is parameter blocks, which are hoisted to the top of
   their section: knobs before cables, or you patch into a closed VCA, hear
   nothing, and start pulling the patch apart looking for the fault.

   It is one-way. A guide cannot be parsed back into a patch, and shouldn't try:
   JSON and PatchBook are the round trips. */

function guideModName(mod, inst){
  var m = byId(mod);
  return (m ? m.name : mod) + (inst ? " (" + inst + ")" : "");
}
function guideJackName(mod, jid){
  var j = jack(mod, jid);
  return j ? j.label : jid;
}

/* What the parser strips, the guide reads back — carefully, because "comment"
   means two things in this language and only one of them may be printed as
   prose. A body shaped like a connection is a disabled cable: the PatchBook
   importer writes exactly those for modules you don't own, and alt-click on a
   cable makes more of them. Printing one as commentary would hand you an
   instruction the patch doesn't contain, so they go to a Not patched list at
   the end instead. The arrow is the test; resolvability is not, since the
   importer's whole point is modules that don't resolve. */
function scanComments(src){
  var lines = (src || "").split("\n");
  var ARROW = /(->|>>|→|\b[pgtc]>)/;
  var first = null;
  lines.forEach(function(raw, i){
    if (first !== null) return;
    var t = raw.trim();
    if (t && !/^(#|\/\/)/.test(t)) first = i + 1;
  });
  var out = { preamble: [], prose: [], disabled: [] };
  lines.forEach(function(raw, i){
    var t = raw.trim();
    var m = t.match(/^(?:\/\/|#)\s?(.*)$/);
    if (!m) return;
    var body = m[1].trim();
    if (!body) return;
    if (ARROW.test(body)) out.disabled.push(body.replace(/^-\s+/, ""));
    else if (first === null || i + 1 < first) out.preamble.push(body);
    else out.prose.push({ line: i + 1, text: body });
  });
  return out;
}

function buildGuide(){
  var groups = [], byName = {};
  function group(name){
    var k = name || "";
    if (!byName[k]){ byName[k] = { name:k, setup:[], steps:[] }; groups.push(byName[k]); }
    return byName[k];
  }
  parsed.cables.forEach(function(c){ group(c.voice).steps.push(c); });

  /* A parameter block belongs with the section where its module is first
     patched. One for a module that never appears in a cable has nowhere better
     to go than the front. */
  var firstIn = {};
  parsed.cables.forEach(function(c){
    [c.from.key, c.to.key].forEach(function(k){
      if (firstIn[k] === undefined) firstIn[k] = c.voice || "";
    });
  });
  Object.keys(parsed.params).forEach(function(k){
    if (!parsed.params[k] || !parsed.params[k].length) return;
    var g = byName[firstIn[k]] || groups[0] || group("");
    var base = k.replace(/#[a-z0-9\-]+$/i, "");
    var inst = k.indexOf("#") >= 0 ? k.slice(k.indexOf("#") + 1) : null;
    g.setup.push({ name: guideModName(base, inst), params: parsed.params[k] });
  });

  var n = 0, allSteps = [];
  groups.forEach(function(g){
    g.steps = g.steps.map(function(c){
      var s = { n: ++n, line: c.line,
        fromMod:  guideModName(c.from.mod, c.from.inst),
        fromJack: guideJackName(c.from.mod, c.from.jack),
        toMod:    guideModName(c.to.mod, c.to.inst),
        toJack:   guideJackName(c.to.mod, c.to.jack),
        note: c.note || "", comments: [] };
      allSteps.push(s);
      return s;
    });
  });
  /* An unnamed group only needs a heading when there are named ones to tell it
     apart from. */
  var named = groups.filter(function(g){ return g.name; }).length;
  groups.forEach(function(g){ g.title = g.name || (named ? "Patch" : ""); });

  /* Prose comments attach to the step that follows them in the source, which
     is where their author wrote them. A chain makes several steps from one
     line; the comment lands on the first. One with no step after it becomes a
     tail note rather than vanishing. */
  var sc = scanComments(patch.src);
  var tail = [];
  sc.prose.forEach(function(cm){
    var best = null;
    allSteps.forEach(function(s){
      if (s.line > cm.line && (!best || s.line < best.line ||
          (s.line === best.line && s.n < best.n))) best = s;
    });
    if (best) best.comments.push(cm.text);
    else tail.push(cm.text);
  });

  /* Disabled cables, resolved to panel names where the modules exist and left
     as written where they don't, which is exactly the imported-patch case. */
  var notPatched = sc.disabled.map(function(body){
    var p = parse(body);
    if (p.cables.length === 1){
      var c = p.cables[0];
      return { fromMod: guideModName(c.from.mod, c.from.inst),
               fromJack: guideJackName(c.from.mod, c.from.jack),
               toMod: guideModName(c.to.mod, c.to.inst),
               toJack: guideJackName(c.to.mod, c.to.jack) };
    }
    return { raw: body };
  });

  return { name: patch.name || "Untitled patch", notes: (patch.notes || "").trim(),
           preamble: sc.preamble, tail: tail, notPatched: notPatched,
           groups: groups, count: n,
           modules: Object.keys(parsed.cables.reduce(function(a, c){
             a[c.from.key] = a[c.to.key] = 1; return a; }, {})).length };
}

function guideHTML(){
  var g = buildGuide();
  var h = '<div id="guidedoc"><h1>' + esc(g.name) + "</h1>";
  h += '<div class="gmeta">' + g.count + " cable" + (g.count === 1 ? "" : "s") +
       " · " + g.modules + " module" + (g.modules === 1 ? "" : "s") + "</div>";
  if (g.notes) h += '<div class="gnotes">' + esc(g.notes).replace(/\n/g, "<br>") + "</div>";
  if (g.preamble.length)
    h += '<div class="gnotes">' + g.preamble.map(esc).join("<br>") + "</div>";
  if (!g.count) h += '<div class="gempty">Nothing to patch yet. Write some cables and this fills in.</div>';

  g.groups.forEach(function(grp){
    if (grp.title) h += "<h2>" + esc(grp.title) + "</h2>";
    if (grp.setup.length){
      h += "<h3>Set up</h3><table class='gset'>";
      grp.setup.forEach(function(s){
        h += '<tr><td class="gmod">' + esc(s.name) + "</td><td>" +
          s.params.map(function(p){
            return '<span class="gparam"><b>' + esc(p.name) + "</b> " + esc(p.value) + "</span>";
          }).join("") + "</td></tr>";
      });
      h += "</table>";
    }
    if (grp.steps.length){
      if (grp.setup.length) h += "<h3>Patch</h3>";
      h += "<table class='gsteps'>";
      grp.steps.forEach(function(s){
        h += '<tr><td class="gn">' + s.n + "</td>" +
          '<td class="gmod">' + esc(s.fromMod) + "</td>" +
          '<td class="gj">' + esc(s.fromJack) + "</td>" +
          '<td class="garr">&rarr;</td>' +
          '<td class="gmod">' + esc(s.toMod) + "</td>" +
          '<td class="gj">' + esc(s.toJack) + "</td></tr>";
        var under = s.comments.concat(s.note ? [s.note] : []);
        if (under.length)
          h += '<tr class="grow-note"><td></td><td colspan="5">' +
               under.map(esc).join("<br>") + "</td></tr>";
      });
      h += "</table>";
    }
  });
  if (g.tail.length)
    h += '<div class="gnotes" style="margin-top:16px">' + g.tail.map(esc).join("<br>") + "</div>";
  if (g.notPatched.length){
    h += "<h2>Not patched</h2><table class='gsteps'>";
    g.notPatched.forEach(function(s){
      h += s.raw
        ? '<tr><td class="gn"></td><td colspan="5" class="mono" style="color:var(--ink3)">' +
          esc(s.raw) + "</td></tr>"
        : '<tr><td class="gn"></td>' +
          '<td class="gmod">' + esc(s.fromMod) + '</td><td class="gj">' + esc(s.fromJack) + "</td>" +
          '<td class="garr">&rarr;</td>' +
          '<td class="gmod">' + esc(s.toMod) + '</td><td class="gj">' + esc(s.toJack) + "</td></tr>";
    });
    h += "</table><div class='hint'>Commented out in the source, so not part of the patch.</div>";
  }
  return h + "</div>";
}

function guideMarkdown(){
  var g = buildGuide();
  var L = ["# " + g.name, "",
           g.count + " cable" + (g.count === 1 ? "" : "s") +
           " · " + g.modules + " module" + (g.modules === 1 ? "" : "s"), ""];
  if (g.notes) L.push(g.notes, "");
  if (g.preamble.length) L.push(g.preamble.join("\n"), "");
  g.groups.forEach(function(grp){
    if (grp.title) L.push("## " + grp.title, "");
    if (grp.setup.length){
      L.push("**Set up**", "");
      grp.setup.forEach(function(s){
        L.push("- " + s.name + ": " + s.params.map(function(p){
          return p.name + " " + p.value; }).join(", "));
      });
      L.push("");
    }
    grp.steps.forEach(function(s){
      var under = s.comments.concat(s.note ? [s.note] : []);
      L.push(s.n + ". " + s.fromMod + " **" + s.fromJack + "** → " +
             s.toMod + " **" + s.toJack + "**" +
             under.map(function(t){ return "  \n   " + t; }).join(""));
    });
    if (grp.steps.length) L.push("");
  });
  if (g.tail.length) L.push(g.tail.join("\n"), "");
  if (g.notPatched.length){
    L.push("## Not patched", "");
    g.notPatched.forEach(function(s){
      L.push("- " + (s.raw ? "`" + s.raw + "`"
        : s.fromMod + " **" + s.fromJack + "** → " + s.toMod + " **" + s.toJack + "**"));
    });
    L.push("");
  }
  return L.join("\n").replace(/\n{3,}/g, "\n\n").replace(/\s+$/, "") + "\n";
}

function toPatchBook(){
  var lines = ["// Exported from the modular reference patch tool",
               "// " + (patch.name || "Untitled patch"), ""];
  var byVoice = {}, order = [];
  (view.allCables || parsed.cables).forEach(function(c){
    var v = c.voice || "PATCH";
    if (!byVoice[v]){ byVoice[v] = []; order.push(v); }
    byVoice[v].push(c);
  });
  order.forEach(function(v){
    lines.push(v.toUpperCase() + ":");
    byVoice[v].forEach(function(c){
      var a = jack(c.from.mod, c.from.jack), b = jack(c.to.mod, c.to.jack);
      var sig = cableSig(c) || "multi";
      lines.push("\t- " + byId(c.from.mod).name + (c.from.inst ? " " + c.from.inst : "") +
        " (" + (a ? a.label : c.from.jack) + ") " + (PB_ARROW[sig] || ">>") + " " +
        byId(c.to.mod).name + (c.to.inst ? " " + c.to.inst : "") +
        " (" + (b ? b.label : c.to.jack) + ")" +
        (c.note ? "   // " + c.note : ""));
    });
    lines.push("");
  });
  Object.keys(parsed.params).forEach(function(k){
    var m = byId(k.replace(/#[a-z0-9\-]+$/i, ""));
    lines.push("\t* " + (m ? m.name : k) + ": " +
      parsed.params[k].map(function(p){ return p.name + " = " + p.value; }).join(" | "));
  });
  return lines.join("\n") + "\n";
}

/* Resolve a PatchBook `Module (Label)` pair back to our ids. Label matching is
   scoped by direction, which is what makes it work — 98% of our labels are
   already unique inside their module, and knowing which end of the arrow you're
   on settles nearly all of the rest. */
function pbResolve(modName, portLabel, dir, report){
  var n = modName.trim().toLowerCase().replace(/\s+\d+$/, function(s){ return s; });
  var inst = null;
  var im = n.match(/^(.*?)\s+(\d+)$/);
  var cands = allModules().filter(function(m){
    return m.name.toLowerCase() === n || m.id === n;
  });
  if (!cands.length && im){
    inst = +im[2];
    cands = allModules().filter(function(m){
      return m.name.toLowerCase() === im[1] || m.id === im[1];
    });
  }
  if (!cands.length){
    report.unmatched.push(modName.trim());
    return null;
  }
  var mod = cands[0];
  var js = (jacksFor(mod.id) || []).filter(function(j){
    return j.dir === dir || j.dir === "both";
  });
  var pl = portLabel.trim().toLowerCase();
  var hit = js.filter(function(j){ return j.label.toLowerCase() === pl; });
  if (!hit.length) hit = js.filter(function(j){ return j.id === pl.replace(/\s+/g,"-"); });
  if (!hit.length) hit = js.filter(function(j){ return j.label.toLowerCase().replace(/[^a-z0-9]/g,"") === pl.replace(/[^a-z0-9]/g,""); });
  if (!hit.length){
    report.unmatchedJacks.push(mod.id + " (" + portLabel.trim() + ")");
    return null;
  }
  if (hit.length > 1) report.ambiguous.push(mod.id + " (" + portLabel.trim() + ") -> " +
    hit.map(function(j){ return j.id; }).join(" / "));
  return mod.id + (inst ? "#" + inst : "") + ":" + hit[0].id;
}

function fromPatchBook(text){
  var PB = { "->":"audio", ">>":"cv", "p>":"pitch", "g>":"gate", "t>":"gate", "c>":"clock" };
  var report = { unmatched:[], unmatchedJacks:[], ambiguous:[], triggers:0, lines:0 };
  var outLines = [], voice = "";
  text.split(/\n/).forEach(function(raw){
    var line = raw.trim();
    if (!line) { return; }
    if (/^\/\//.test(line)){ outLines.push("# " + line.replace(/^\/\/\s?/, "")); return; }
    var cm = line.match(/^-\s*(.+?)\s*\((.+?)\)\s*(->|>>|[a-z]>)\s*(.+?)\s*\((.+?)\)\s*(\[.*\])?$/);
    if (cm){
      report.lines++;
      if (cm[3] === "t>") report.triggers++;
      var from = pbResolve(cm[1], cm[2], "out", report);
      var to   = pbResolve(cm[4], cm[5], "in",  report);
      if (from && to)
        outLines.push(from + " -> " + to + " [" + (PB[cm[3]] || "cv") + "]");
      else
        outLines.push("# UNRESOLVED: " + line);
      return;
    }
    var vm = line.match(/^([^*|\-].*):$/);
    if (vm && !/\(/.test(line)){ voice = vm[1].trim(); outLines.push("", voice + ":"); return; }
    var pmm = line.match(/^\*\s*([^:]+):\s*(.*)$/);
    if (pmm){
      var mm = allModules().filter(function(m){
        return m.name.toLowerCase() === pmm[1].trim().toLowerCase() || m.id === pmm[1].trim().toLowerCase();
      })[0];
      outLines.push("* " + (mm ? mm.id : pmm[1].trim()) + ":" + (pmm[2] ? " " + pmm[2] : ""));
      if (!mm) report.unmatched.push(pmm[1].trim());
      return;
    }
    if (/^\|/.test(line)){ outLines.push(line); return; }
  });
  return { src: outLines.join("\n").replace(/^\n+/, ""), report: report };
}

function slug(s){
  return String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
}
/* ---------------------------------------------------------------- overlay --- */

function openSheet(html){
  document.getElementById("sheet").innerHTML = html;
  document.getElementById("veil").classList.add("on");
}
function closeSheet(){ document.getElementById("veil").classList.remove("on"); }
document.getElementById("veil").addEventListener("click", function(ev){
  if (ev.target.id === "veil") closeSheet();
});
document.addEventListener("keydown", function(ev){
  /* Escape does ONE thing per press, most-nested first: close a dialog, else
     close a menu, else leave full-width. Marking the event is how later handlers
     know it's already been dealt with. */
  if (ev.key === "Escape" && document.getElementById("veil").classList.contains("on")){
    closeSheet(); ev.__escHandled = true;
  }
});

function copy(text, message){
  if (navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(function(){ flash(message); },
      function(){ fallbackCopy(text, message); });
  } else fallbackCopy(text, message);
}
function fallbackCopy(text, message){
  var ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flash(message); }
  catch(e){ flash("Copy blocked. Use Download instead.", true); }
  document.body.removeChild(ta);
}
/* A download gives no feedback of its own: the file lands wherever the browser
   puts it and the sheet sits there looking untouched. Say what happened, and
   repeat where the file goes, because that is the bit people forget. */
function done(btn, msg){
  var was = btn.textContent;
  btn.textContent = "✓ " + msg;
  btn.disabled = true;
  setTimeout(function(){ btn.textContent = was; btn.disabled = false; }, 3200);
}

function flash(text, bad){
  var el = document.getElementById("stat");
  el.innerHTML = '<span style="color:'+(bad?"var(--bad)":"var(--ok)")+'">'+esc(text)+'</span>';
  setTimeout(updateStat, 2200);
}

/* A real Save dialogue when the browser will give us one, so you can navigate
   to patches/ and put the file where it belongs instead of fishing it out of
   Downloads afterwards. Chrome and Edge only, and it needs a secure context,
   which file:// is not. So opening index.html by double-clicking gets the old
   anchor download, which is the case this app most wants to keep working.

   The id makes the browser reopen in the same folder next time, which is the
   whole point when you save to the same place every time. */
/* The button should say what will actually happen, and that depends on where
   the page was opened from. */
/* Served from someone else's web host, as opposed to your own folder or a
   localhost server. A visitor there cannot put a file next to index.html, so
   telling them to "save it as patches/patches.js" is an instruction they can't
   follow and it reads as though the app is broken. */
function hosted(){
  return /^https?:$/.test(location.protocol) &&
    !/^(localhost|127\.0\.0\.1|\[::1\]|0\.0\.0\.0)$/.test(location.hostname);
}

function canPick(){ return !!(window.showSaveFilePicker && window.isSecureContext); }
function saveLabel(name){ return canPick() ? "Save " + name + "\u2026" : "Download " + name; }

function saveFile(name, text, btn, where){
  /* done() adds the tick. */
  var placed = "Saved as " + name;
  var fell   = "Downloaded. Save it as " + where;
  if (window.showSaveFilePicker && window.isSecureContext){
    window.showSaveFilePicker({
      suggestedName: name,
      id: "patching-export",
      startIn: "documents",
      types: [{ description:"JavaScript", accept:{ "text/javascript":[".js"] } }]
    }).then(function(h){
      return h.createWritable().then(function(w){
        return w.write(text).then(function(){ return w.close(); });
      }).then(function(){ if (btn) done(btn, placed); });
    }).catch(function(e){
      /* Cancelling is not a failure and should say nothing at all. */
      if (e && e.name === "AbortError") return;
      download(name, text);
      if (btn) done(btn, fell);
    });
    return;
  }
  download(name, text);
  if (btn) done(btn, fell);
}

function download(name, text){
  var blob = new Blob([text], {type:"text/plain"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
}

/* --------------------------------------------------------------- examples --- */
/*
   Loading an example always creates a NEW patch, so it can't overwrite what
   you were working on.
*/
var EXAMPLES = window.PATCH_EXAMPLES || [];

/* A name not already taken, so two different examples never collide and an
   edited copy is visibly distinct from the original. */
function uniquePatchName(base){
  var taken = {}, n = 2, name = base;
  allPatches().forEach(function(p){ taken[p.name] = 1; });
  while (taken[name]) name = base + " " + (n++);
  return name;
}

function loadExample(i){
  var ex = EXAMPLES[i]; if (!ex) return;
  save();

  /* Three rules, in order, so repeatedly opening an example doesn't fill the
     patch list with copies of itself:

       1. an untouched copy already exists  ->  just go to it
       2. the current patch is empty        ->  load into it
       3. otherwise                          ->  new patch, name made unique

     Rule 1 keys on the source text being byte-identical to the example, so the
     moment you change anything the patch stops matching and a fresh load makes
     a new one instead. Your edits are never overwritten and never duplicated. */
  var existing = null;
  allPatches().forEach(function(p){ if (!existing && p.src === ex.src) existing = p; });
  if (existing){
    showPatch(existing);
    save(); paintList(); render(); setTimeout(fitWidth, 0);
    flash("Switched to your existing “" + existing.name + "”.");
    return;
  }

  /* Reuse the current patch only when it's empty AND yours. Loading an example
     over a patch that came from a file would shadow the file entry with an
     example, which is not what "load into the blank one" meant. */
  var blank = (!patch.src || !patch.src.trim()) && !fromFile(patch.id);
  var target = blank ? patch : newPatch();
  target.name = uniquePatchName(ex.name);
  target.src = ex.src;
  target.pos = {};              /* let it lay itself out */
  store.patches[target.id] = target;
  showPatch(target);
  save(); paintList(); render();
  setTimeout(fitWidth, 0);
  flash(blank ? "Loaded “" + ex.name + "”."
              : "Loaded “" + patch.name + "” as a new patch.");
}

function paintExamples(){
  var host = document.getElementById("exmenu");
  if (!host || !EXAMPLES.length) return;
  host.innerHTML = '<hr><div class="lbl">Start from an example</div>' +
    EXAMPLES.map(function(ex, i){
      return '<button data-ex="'+i+'">'+esc(ex.name)+
        (ex.about ? '<small>'+esc(ex.about)+'</small>' : '')+'</button>';
    }).join("");
  host.addEventListener("click", function(ev){
    var b = ev.target.closest("[data-ex]");
    if (b) loadExample(+b.dataset.ex);
  });
}

/* ------------------------------------------------------------------ menus --- */
/* Click to open, click anywhere else or press Escape to close, and opening one
   closes the others. Menu items close the menu themselves so every handler
   underneath stays exactly as it was. */
function closeMenus(){
  [].forEach.call(document.querySelectorAll(".menu.open"), function(m){ m.classList.remove("open"); });
}
document.addEventListener("click", function(ev){
  var opener = ev.target.closest("[data-open]");
  if (opener){
    var m = opener.parentNode, wasOpen = m.classList.contains("open");
    closeMenus();
    if (!wasOpen) m.classList.add("open");
    ev.stopPropagation();
    return;
  }
  if (ev.target.closest(".dropdown")) { setTimeout(closeMenus, 0); return; }
  closeMenus();
});
document.addEventListener("keydown", function(ev){
  if (ev.key !== "Escape" || ev.__escHandled) return;
  if (document.querySelector(".menu.open")){ closeMenus(); ev.__escHandled = true; }
});
